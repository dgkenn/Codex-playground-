# XcodeGen spec. Committed instead of a .xcodeproj because a generated project cannot produce merge
# conflicts in an unreadable XML blob, and because it makes the build configuration reviewable.
#
#   brew install xcodegen && xcodegen generate && open MarathonCoach.xcodeproj
#
# Regenerate the bundled resources first, or the app will refuse to start and tell you to:
#
#   cd ../../engine && python -m marathon_engine.export ../ios/MarathonCoach/Resources
name: MarathonCoach
options:
  bundleIdPrefix: coach.marathon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Warnings-as-errors on the app target: this is a single-user app with no deadline pressure, so
    # there is no reason to let a warning accumulate.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MarathonCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: coach.marathon.app
        # The Polar SDK is not a dependency: the PMD protocol is implemented directly in
        # PolarPMD.swift, ported from hardware-tested Python. That keeps the app free of RxSwift and
        # keeps the protocol handling unit-testable without hardware.
        TARGETED_DEVICE_FAMILY: "1"
    capabilities:
      HealthKit: true
      BackgroundModes:
        modes: [bluetooth-central, location, audio]
  MarathonCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MarathonCoach
