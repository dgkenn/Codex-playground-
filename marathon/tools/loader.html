<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pace Coach</title>
<!--
  A loader, not the app.

  The problem it solves
  ---------------------
  The app has to be reachable from an iPhone with no sign-in, no App Store and no setup, which leaves
  a static host. raw.githack.com is the one that serves GitHub content as text/html — but it caches
  hard, and ignores query strings, so a fix pushed here can take hours to reach the phone. That turns
  every fix into "reload and try again", which is not a debugging loop, it is a guess.

  raw.githubusercontent.com is the opposite: always current, CORS-open, and served as text/plain, so
  a browser will download it rather than render it.

  So: this page never changes, which makes githack's caching harmless — a cached copy of a file that
  is identical to the fresh one costs nothing. It fetches the app, which changes constantly, from the
  host that is always current, and replaces itself with it. One stable URL; every push live at once.

  Why document.write rather than an iframe
  ----------------------------------------
  Web Bluetooth and geolocation are gated by Permissions Policy, and delegating them into a frame is
  unreliable in third-party WebViews — Bluefy being the one that matters, since it is the only route
  to the armband from an iPhone. Writing into this same document keeps the app in the top-level
  browsing context that already holds those permissions.

  This is also why the app ships a classic script rather than a module: module scripts written into
  an opened document are not reliably executed.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #0f1115; color: #e8eaf0;
    padding: 24px; text-align: center;
  }
  main { max-width: 30rem; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .5rem; letter-spacing: .01em; }
  p { margin: .5rem 0; color: #9aa3b2; font-size: .92rem; }
  code { font: .8rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c8cedb;
         word-break: break-all; }
  button {
    margin-top: 1rem; padding: .8rem 1.4rem; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 10px; background: #3b6ef5; color: #fff;
  }
  .spin {
    width: 22px; height: 22px; margin: 0 auto 1rem;
    border: 2px solid #2a3040; border-top-color: #3b6ef5; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
<main>
  <div class="spin" id="spin"></div>
  <h1 id="head">Loading the coach…</h1>
  <p id="note">Fetching the current build.</p>
</main>
<script>
(function () {
  'use strict';

  // Pinned to the branch, not to a commit: the point is that the newest push wins without this file
  // being touched. Fetching by commit SHA would be immutable and instant, and is exactly what a file
  // that never changes cannot do — it would have to know the SHA.
  //
  // The cost of the branch URL is that raw.githubusercontent sits behind Fastly with max-age=300,
  // and that edge ignores query strings, so a push takes up to five minutes to arrive. `no-store`
  // defeats the browser's cache, not Fastly's; the cache-buster below is belt and braces for the
  // same reason. Five bounded minutes against githack's several hours is the trade being made, and
  // the build id in the footer is how you tell which side of it you are on.
  var APP = 'https://raw.githubusercontent.com/dgkenn/Codex-playground-'
          + '/claude/iphone-marathon-training-app-d2xxuc/docs/pace-coach.html';

  var head = document.getElementById('head');
  var note = document.getElementById('note');
  var spin = document.getElementById('spin');

  function fail(why) {
    spin.remove();
    head.textContent = 'Could not load the coach';
    note.innerHTML = '<code>' + String(why).replace(/[<&]/g, '') + '</code>'
      + '<br><br>Check the connection and try again.';
    var b = document.createElement('button');
    b.textContent = 'Retry';
    b.onclick = go;
    document.querySelector('main').appendChild(b);
  }

  function go() {
    var btn = document.querySelector('button');
    if (btn) btn.remove();
    head.textContent = 'Loading the coach…';
    note.textContent = 'Fetching the current build.';

    fetch(APP + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        // A truncated response would write a half-page whose scripts never run, which looks exactly
        // like the app being broken. Cheaper to refuse it.
        //
        // The test is that the last thing in the file is the closing script tag, because that is
        // what the build actually emits — the page has no <html> element for the browser to close,
        // so looking for </html> rejects every good response as well as every bad one. It did, and
        // the phone would have shown a spinner for ever.
        // The slash is escaped because this is itself inside a script block. The HTML parser looks
        // for the closing tag by scanning raw text — it has no idea it is inside a string, or a
        // comment — so an unescaped one ends the block right there and everything after it becomes
        // stray markup. Which is why this sentence does not spell it out either.
        var complete = html.length > 20000
                    && html.replace(/\s+$/, '').slice(-9).toLowerCase() === '<\/script>';
        if (!complete) throw new Error('incomplete response (' + html.length + ' bytes)');
        // Leave a mark that survives the handover.
        //
        // `document.open()` removes every event listener registered on the document. If a browser's
        // Web Bluetooth bridge routes its native callbacks through one — a normal WKWebView pattern
        // — then `requestDevice` would still work, because the picker is native and one-shot, while
        // a later `connect` reply would have nowhere to land. That is the exact shape of the failure
        // being chased, so whether this path was taken has to appear in the diagnostics rather than
        // being argued about.
        window.__viaLoader = true;
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (e) { fail(e.message || e); });
  }

  go();
})();
</script>
