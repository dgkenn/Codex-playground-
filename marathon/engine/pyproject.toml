[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marathon-engine"
version = "0.1.0"
description = "Tested training-science core for a personal couch-to-marathon coaching app"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["marathon_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
