# XcodeGen spec for the watch coach and the iPhone app that carries it. Built in CI on a GitHub Mac
# runner (.github/workflows/watch-app.yml): there is no Mac in this project, so nothing here is ever
# opened in Xcode by hand. Bundle IDs and the team are build settings so CI can set them:
#
#   xcodegen generate && xcodebuild -scheme PaceCoach PC_BUNDLE_PREFIX=com.example DEVELOPMENT_TEAM=XXXXXXXXXX
name: PaceCoach
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    PC_BUNDLE_PREFIX: com.dgkenn
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  CoachCore:
    path: CoachCore
targets:
  PaceCoach:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - target: PaceCoachWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pace Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PC_BUNDLE_PREFIX).pacecoach
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PaceCoachWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: CoachCore
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pace Coach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PC_BUNDLE_PREFIX).pacecoach
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Pace Coach reads your heart rate during runs to decide when to run and when to walk.
        NSHealthUpdateUsageDescription: Pace Coach saves each run as a workout in Health.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Watch/PaceCoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PC_BUNDLE_PREFIX).pacecoach.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PaceCoach:
    build:
      targets:
        PaceCoach: all
        PaceCoachWatch: all
    archive:
      config: Release
  PaceCoachWatch:
    build:
      targets:
        PaceCoachWatch: all
