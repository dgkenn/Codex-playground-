# EXO-OFI exogenous order-flow collector (node EXO-OFI, 2026-07-15).
# Always-on collection of Coinbase signed order-flow + book imbalance for BTC/ETH/SOL, the one
# exogenous signal the Kalshi tick archive lacks (it has sampled spot+microprice; observable spot
# momentum is already priced -> node EXO-MOM). Forward-only test of the operator-chosen domain
# "exogenous signal -> Kalshi 15m binaries"; hypothesis + gate PRE-REGISTERED in OFI_FORWARD.md.
#
# Self-chaining design (mirrors collect.yml): each run dispatches its successor so continuity does
# NOT depend on cron; three crons/hour are the chain-restart backstop; non-cancelling concurrency
# group so runs queue back-to-back and never overlap. READ-ONLY public REST, no auth, no orders.
# Data (ofi_coinbase_<asset>_r<run>.jsonl.gz) is committed to the gha-data branch, date-partitioned.
# NOTE: schedule/dispatch fire only from the DEFAULT branch (main), so this file lives on main; it
# checks out the collector CODE from $BRANCH and commits DATA to gha-data.
name: ofi-collect

on:
  schedule:
    - cron: '7,27,47 * * * *'      # chain-restart backstop only; offsets dodge congestion
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write                   # self-chain: each run dispatches its successor

concurrency:
  group: ofi-collect
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  ofi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: collect ~18 min of Coinbase signed-flow (stdlib only, SIGTERM-safe)
        run: |
          rm -rf gha_data && mkdir -p gha_data
          OFI_OUT_DIR=gha_data OFI_RUN_SEC=1080 OFI_POLL_SEC=2 \
            timeout --signal=TERM --kill-after=30 1140 \
            python -u ofi_collect.py || true
          echo "collected files:"; find gha_data -name 'ofi_coinbase_*' | head
      - name: commit data to the gha-data branch (worktree, shallow, date-partitioned)
        if: always()
        run: |
          git config user.name  "ofi-bot"
          git config user.email "ofi-bot@users.noreply.github.com"
          test -n "$(find gha_data -name 'ofi_coinbase_*' 2>/dev/null)" || { echo "no data"; exit 0; }
          day=$(date -u +%Y-%m-%d)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "/tmp/dw/gha_data/$day"
          cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
          cd /tmp/dw
          git add gha_data
          git commit -m "gha: ofi-collect r${{ github.run_id }} ($day $(date -u +%H:%MZ))" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git push origin "HEAD:gha-data" && exit 0
            sleep $((RANDOM % 8 + 2))
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/dw 2>/dev/null || rm -rf /tmp/dw
            rm -f .git/shallow.lock
            git fetch --depth=1 origin gha-data || true
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
            mkdir -p "/tmp/dw/gha_data/$day"
            cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
            git add gha_data
            git commit -m "gha: ofi-collect r${{ github.run_id }} ($day $(date -u +%H:%MZ)) retry$i" \
              || { echo "nothing to commit"; exit 0; }
          done
          echo "push failed after retries" >&2; exit 1
      - name: self-chain -- dispatch the successor run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/disp.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ofi-collect.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && { echo "successor dispatched"; exit 0; }
            echo "dispatch attempt $i -> HTTP $code"; cat /tmp/disp.out || true
            sleep $((2**i))
          done
          echo "WARNING: self-dispatch failed; cron backstop will restart the chain" >&2
