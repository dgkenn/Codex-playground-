# Push-triggered run canceller (companion to launcher.yml). Write a live-trade run id into the
# CANCEL file and push -- that run gets cancelled with the repo token (actions:write). Used to
# evict a stale-config leg from the live-trade singleton so a queued correct-config leg starts.
name: canceller
on:
  push:
    branches: [main]
    paths: [CANCEL]
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: cancel the run id in CANCEL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(tr -dc '0-9' < CANCEL)
          [ -n "$RID" ] || { echo "no run id in CANCEL"; exit 0; }
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/c.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RID}/cancel")
            { [ "$code" = "202" ] || [ "$code" = "409" ]; } && { echo "cancel $RID -> HTTP $code (done)"; exit 0; }
            echo "attempt $i -> HTTP $code"; cat /tmp/c.out || true; sleep $((2**i))
          done
          echo "::error::cancel failed"; exit 1
