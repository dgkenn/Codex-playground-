# kwx-synoptic-trial -- side-by-side DETECTION-LATENCY measurement: paid Synoptic 1-min HF-ASOS feed vs the
# free MADIS/weather.gov path the live bot already uses (wx_synoptic_trial.py). This is the evidence run for
# the pay/don't-pay decision on the Synoptic subscription (~$900 -> ~$2,280/mo modeled EV, kwx_bankroll_curve
# via kwx_runner._synoptic_primary) -- it measures the thing the money actually buys (minutes of detection
# lead) instead of re-deriving the decision from the published decay curve alone.
#
# DORMANT BY DEFAULT: gated in bash on the SYNOPTIC_TOKEN repo secret. With no secret set this workflow is
# inert (prints a notice and exits 0 every run, no commits) -- arm it by adding a SYNOPTIC_TOKEN repo secret
# from the free 14-day Synoptic trial (synopticdata.com). Runs during US-afternoon fire windows, the same
# hours the live cities' highs are climbing and running-max crossings actually happen to race.
#
# Checks out the CODE branch (claude/coding-bot-ab-test-results-ffmhxw), NOT main -- wx_synoptic_trial.py /
# synoptic_feed.py / kwx_runner.py live there. This workflow file itself lives on main (scheduled workflows
# only fire from the default branch), mirroring kwx-earlylock/kwx-forecast.
#
# READ-ONLY: obs feeds only (Synoptic + the runner's free cascade), no Kalshi, no orders, no KWX_LIVE.
name: kwx-synoptic-trial

on:
  schedule:
    # US afternoon fire windows, hourly 18:00-23:00 UTC (~10am-6pm across UTC-8..UTC-5 local afternoons) --
    # same band as kwx-earlylock's rising-temp cron, offset to a different minute to avoid runner contention.
    - cron: '41 18,19,20,21,22,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kwx-synoptic-trial
  cancel-in-progress: false

env:
  CODE_BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip -q install numpy scipy && break; sleep 8; done
      - name: measure (gated on SYNOPTIC_TOKEN) + report + commit log
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          set -e
          if [ -z "${SYNOPTIC_TOKEN}" ]; then
            echo "::notice::SYNOPTIC_TOKEN not set -> inert (arm by adding the repo secret from the free trial)"
            exit 0
          fi
          git config user.name  "kwx-synoptic-trial-bot"
          git config user.email "kwx-synoptic-trial-bot@users.noreply.github.com"
          python -u wx_synoptic_trial.py --minutes 12 || true
          python -u wx_synoptic_trial.py --report      || true
          # per-file guarded add: only force-add the jsonl if this run actually produced/updated it.
          if [ -f wx_synoptic_trial.jsonl ]; then git add -f wx_synoptic_trial.jsonl; fi
          git commit -q -m "synoptic trial $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${CODE_BRANCH}" && exit 0
            git fetch -q origin "$CODE_BRANCH" && git rebase -q "origin/${CODE_BRANCH}" || true
            sleep $((RANDOM % 5 + 2))
          done
