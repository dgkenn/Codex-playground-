name: tg-test
on: push
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: telegram diagnostic (read-only) + fresh marker
        env:
          TG:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG" ]  || { echo "::error::TELEGRAM_BOT_TOKEN empty"; exit 1; }
          [ -n "$CID" ] || { echo "::error::TELEGRAM_CHAT_ID empty"; exit 1; }
          echo "=== getMe (bot identity) ==="
          curl -s "https://api.telegram.org/bot${TG}/getMe"; echo
          echo "=== getWebhookInfo (a non-empty url here = poller getUpdates is BLOCKED) ==="
          curl -s "https://api.telegram.org/bot${TG}/getWebhookInfo"; echo
          echo "=== send fresh marker ==="
          code=$(curl -s -o /tmp/r -w '%{http_code}' "https://api.telegram.org/bot${TG}/sendMessage" \
            --data-urlencode chat_id="$CID" \
            --data-urlencode text="🔎 Diagnostic ping. If you see THIS, Telegram delivery is fine — the silent trader is the pre-secret 04:16 cycle. The auto armed-ping + fill alerts begin on the next live cycle (~05:02). Reply 'status' now to test the switch.")
          echo "marker sendMessage -> HTTP $code"; cat /tmp/r; echo
          [ "$code" = "200" ] || exit 1
