# Nightly promotion-bar check + ops dashboard. Read-only on the shadow A/B corpus (no money, no
# roster edits -- promotion_check.py is alert-only by design). Pulls the collected gha_data/ tree
# from the gha-data branch (same idiom as strategy-alert.yml), runs the pre-registered promotion
# bar (strategies.py's as_markout note) and renders gha_data/DASHBOARD.html, then commits ONLY the
# dashboard file back to gha-data (worktree, shallow, same commit idiom as collect.yml -- never
# touches the code branch).
#
# Like the other workflows, this file must live on the DEFAULT branch (main) for its schedule to
# fire; it checks out CODE (promotion_check.py, dashboard.py, verdict_ledger.py, strategies.py,
# dataio.py, notify.py) from $BRANCH.
name: dashboard

on:
  schedule:
    - cron: '7 5 * * *'      # daily 05:07 UTC
  workflow_dispatch: {}

permissions:
  contents: write             # commit DASHBOARD.html to the gha-data branch

concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet requests && break; sleep 5; done
      - name: pull the shadow-window corpus + SUMMARY.txt history from gha-data
        run: |
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git checkout origin/gha-data -- gha_data 2>/dev/null || mkdir -p gha_data
          else
            mkdir -p gha_data
          fi
      - name: pre-registered promotion-bar check (alert-only; Telegram if PROMOTE-READY)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python promotion_check.py
      - name: render gha_data/DASHBOARD.html (self-contained; degrades gracefully section-by-section)
        run: python dashboard.py
      - name: commit DASHBOARD.html to the gha-data branch (worktree, shallow, retry-with-rebase)
        if: always()
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          test -f gha_data/DASHBOARD.html || { echo "no dashboard produced"; exit 0; }
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dbw origin/gha-data
            cd /tmp/dbw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dbw HEAD
            cd /tmp/dbw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dbw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dbw/gha_data
          cp "$GITHUB_WORKSPACE/gha_data/DASHBOARD.html" /tmp/dbw/gha_data/DASHBOARD.html
          cd /tmp/dbw
          git add gha_data/DASHBOARD.html
          git commit -m "dashboard: nightly refresh $(date -u +%Y-%m-%dT%H:%MZ)" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:gha-data" && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "dashboard push failed after retries" >&2; exit 1
