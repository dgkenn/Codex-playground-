# Robust, self-healing KALSHI data collection on GitHub Actions (public repo => free/unlimited).
# Collects KALSHI 15-min crypto markets (KX{BTC,ETH,SOL,XRP}15M) via public no-auth REST.
# Runs kalshi_collect.py which applies the registered strategy variants against Kalshi's live book
# (REST-polled ~1Hz, no auth required). Each run writes UNIQUE gzipped files
# (gha_data/fills_kalshi_<asset>15m_r<run_id>.jsonl.gz etc.) with asset/tenor_min/venue fields.
#
# MULTI-MONTH DESIGN (audit 2026-06-10; the previous hourly design lost ~2 of 4 windows/hour and had
# no outage detection):
#   * TWO crons/hour + a non-cancelling concurrency group: runs QUEUE back-to-back, so collection is
#     near-continuous and a dropped cron tick (GitHub sheds schedule events under load -- observed
#     multi-hour gaps) costs nothing as long as one of the two fires.
#   * `timeout --signal=TERM` + kalshi_collect's SIGTERM handling: graceful drain persists TOMBSTONES
#     for unresolved windows instead of losing them.
#   * commit step runs `if: always()` into a WORKTREE (never in-place branch switching) with a
#     SHALLOW fetch -- the data branch grows for months without growing the per-run transfer.
#   * data is date-partitioned (gha_data/YYYY-MM-DD/...) so no directory ever accumulates >a few
#     hundred files; bulk streams are gzipped by the collector (~10.5x).
#   * HEARTBEAT_URL (healthchecks.io) is the external dead-man: it alerts when pings STOP -- the only
#     layer that catches a total Actions outage. Set the secret; harmless if unset.
#   * watch_continuity.py is the operator-side freshness check (reads the gha-data branch).
#
# READ-ONLY paper sim (Kalshi public REST, no keys required -- CFTC-regulated/US-legal).
# NOTE: GitHub only fires `schedule`/`workflow_dispatch` from the file on the DEFAULT branch (main),
# so this file must also live on main to activate. It checks out CODE from $BRANCH but commits DATA
# to the `gha-data` branch. Pull data for analysis:
#   git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
name: paper-collect

on:
  schedule:
    - cron: '9 * * * *'           # offsets dodge top-of-hour cron congestion; the concurrency
    - cron: '39 * * * *'          # group queues these back-to-back -> near-continuous coverage
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:                      # never overlap; a newly queued run waits for the in-flight one
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-btc-backtest-XZkKI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install --quiet numpy scipy requests websockets
      - name: preflight -- validate strategy roster (fail fast on a malformed registry)
        run: python strategies.py
      - name: collect ~42 min of Kalshi 15-min crypto windows (KX{BTC,ETH,SOL,XRP}15M, gzipped, tombstone-safe)
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          # START CLEAN: the checkout may carry legacy tracked gha_data from the code branch;
          # re-copying it onto gha-data every run is dead weight and a stale-clobber hazard.
          rm -rf gha_data && mkdir -p gha_data
          # 2520s collect + graceful TERM at 2880s (kalshi_collect handles SIGTERM -> tombstones
          # for unresolved windows) + hard KILL 60s later as the backstop.
          timeout --signal=TERM --kill-after=60 2880 \
            python -u kalshi_collect.py 2520 gha_data "r${{ github.run_id }}" || true
      - name: per-run summary
        if: always()
        run: python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
      - name: commit data to the gha-data branch (worktree, shallow, date-partitioned)
        if: always()
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          test -n "$(ls -A gha_data 2>/dev/null)" || { echo "no data"; exit 0; }
          day=$(date -u +%Y-%m-%d)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "/tmp/dw/gha_data/$day"
          cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
          cd /tmp/dw
          git add gha_data
          git commit -m "gha: paper-collect r${{ github.run_id }} ($day $(date -u +%H:%MZ))" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:gha-data" && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
