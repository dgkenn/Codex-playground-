# Robust, self-healing paper-data collection on GitHub Actions (public repo => free/unlimited).
# Runs the shadow variant comparison ACROSS BTC/ETH/SOL/XRP (15m) in parallel ~50 min each hour on
# GitHub's infra -- independent of the ephemeral dev container, so it survives container reclamation with
# zero manual restarts. Each market-process writes UNIQUE files (gha_data/shadow_windows_<asset><tenor>m_r
# <run_id>.jsonl) with asset/tenor_min fields -> never conflicts AND lets breadth_net_corr.py measure
# micro_gate's true cross-market net correlation. A crashed run just means next hour starts fresh
# (self-healing). READ-ONLY paper sim (public Polymarket WS + Coinbase spot, NO keys).
# Aggregate with: python aggregate_shadow.py ; cross-market: python breadth_net_corr.py
#
# NOTE: GitHub only fires `schedule`/`workflow_dispatch` from the file on the DEFAULT branch (main),
# so this file must also live on main to activate. It checks out CODE from the feature branch but
# commits DATA to a separate `gha-data` branch (so it can never clobber code commits on the feature
# branch). Pull data for analysis: git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
name: paper-collect

on:
  schedule:
    - cron: '7 * * * *'          # hourly at :07 (offset dodges top-of-hour cron congestion)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:                      # never overlap; let an in-flight run finish
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-btc-backtest-XZkKI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58           # < 60 so the hourly schedule never overlaps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install --quiet numpy scipy requests websockets
      - name: preflight -- validate strategy roster (fail fast on a malformed registry)
        run: python strategies.py
      - name: collect ~50 min of live windows (MULTI-ASSET: btc/eth/sol/xrp 15m in parallel)
        run: |
          mkdir -p gha_data
          # multi_market.py runs shadow_compare per (asset,tenor) as separate processes, each writing
          # uniquely-tagged window files with asset/tenor_min fields -> lets breadth_net_corr.py measure
          # micro_gate's TRUE cross-market net correlation (the real breadth Sharpe). 4 WS connections,
          # mostly I/O-bound, fine on the 2-core runner.
          timeout 3000 python -u multi_market.py 2940 gha_data "r${{ github.run_id }}" || true
      - name: aggregate rolling summary
        run: python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
      - name: commit data to the dedicated DATA branch (never touches the code branch)
        run: |
          # Data goes to its own branch `gha-data`, NOT the code branch. The old design rebased+pushed
          # onto the feature branch every ~10min and CLOBBERED code commits. The job still RUNS from the
          # code branch (checkout above); only artifacts land on gha-data. Pull data for analysis with:
          #   git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          test -n "$(ls -A gha_data 2>/dev/null)" || { echo "no data"; exit 0; }
          cp -r gha_data /tmp/gha_data_new
          if git fetch origin gha-data 2>/dev/null; then
            git checkout -B gha-data origin/gha-data           # accumulate onto existing data history
          else
            git checkout --orphan gha-data                     # first time: fresh data branch
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          mkdir -p gha_data
          cp -r /tmp/gha_data_new/. gha_data/                  # add THIS run's unique r<id> files
          git add gha_data
          git commit -m "gha: paper-collect r${{ github.run_id }}" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin gha-data 2>/dev/null || true
            git push origin "HEAD:gha-data" && break
            sleep $((RANDOM % 6 + 2))
          done
