# Robust, self-healing KALSHI data collection on GitHub Actions (public repo => free/unlimited).
# Collects KALSHI 15-min crypto markets (KX{BTC,ETH,SOL,XRP}15M) via public no-auth REST.
# Runs kalshi_collect.py which applies the registered strategy variants against Kalshi's live book
# (REST-polled ~1Hz, no auth required). Each run writes UNIQUE gzipped files
# (gha_data/fills_kalshi_<asset>15m_r<run_id>.jsonl.gz etc.) with asset/tenor_min/venue fields.
#
# ALWAYS-ON DESIGN (audit 2026-06-11; the cron-only design had 2-3.7h GAPS -- GitHub sheds schedule
# ticks under load, observed directly in the run history):
#   * SELF-CHAIN: every run's last step dispatches the NEXT run via workflow_dispatch (an explicit
#     exception to GITHUB_TOKEN's no-recursion rule), so continuity does NOT depend on cron at all.
#     The chain only breaks if a runner dies before the always() dispatch step -- and then:
#   * THREE crons/hour are the chain-RESTART backstop (any single tick firing re-arms the chain;
#     shedding must kill every tick for hours AND the chain simultaneously to cause a gap).
#   * non-cancelling concurrency group: chained + cron runs QUEUE back-to-back, never overlap.
#   * `timeout --signal=TERM` + kalshi_collect's SIGTERM handling: graceful drain persists TOMBSTONES
#     for unresolved windows instead of losing them.
#   * commit step runs `if: always()` into a WORKTREE (never in-place branch switching) with a
#     SHALLOW fetch -- the data branch grows for months without growing the per-run transfer.
#   * data is date-partitioned (gha_data/YYYY-MM-DD/...) so no directory ever accumulates >a few
#     hundred files; bulk streams are gzipped by the collector (~10.5x).
#   * HEARTBEAT_URL (healthchecks.io) is the external dead-man: it alerts when pings STOP -- the only
#     layer that catches a total Actions outage. Set the secret; harmless if unset.
#   * watch_continuity.py is the operator-side freshness check (reads the gha-data branch).
#   * TO STOP the chain: disable the workflow in the Actions UI (dispatch then 403s and the chain
#     ends). Deleting the cron lines alone is NOT enough.
#
# READ-ONLY paper sim (Kalshi public REST, no keys required -- CFTC-regulated/US-legal).
# NOTE: GitHub only fires `schedule`/`workflow_dispatch` from the file on the DEFAULT branch (main),
# so this file must also live on main (as collect.yml) to activate. It checks out CODE from $BRANCH
# but commits DATA to the `gha-data` branch. Pull data for analysis:
#   git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
name: paper-collect

on:
  schedule:
    - cron: '9,29,49 * * * *'     # chain-restart backstop only; offsets dodge top-of-hour congestion
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write                  # self-chain: each run dispatches its successor

concurrency:                      # never overlap; a newly queued run waits for the in-flight one
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5   # the branch with the ultra-rich collector

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: |
          for i in 1 2 3; do pip install --quiet numpy scipy requests websockets && break; sleep 10; done
      - name: preflight -- validate strategy roster (fail fast on a malformed registry)
        run: python strategies.py
      - name: collect ~42 min of Kalshi 15-min crypto windows (KX{BTC,ETH,SOL,XRP}15M, gzipped, tombstone-safe)
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FAST ON/OFF: the poller dispatches a live run on "on" and cancels it on "off" via the
          # Actions API -> on/off act in ~1 min instead of waiting for the live cron. Needs the token
          # (job already has actions:write for the self-chain).
          GH_TOKEN: ${{ github.token }}
        run: |
          # START CLEAN: the checkout may carry legacy tracked gha_data from the code branch;
          # re-copying it onto gha-data every run is dead weight and a stale-clobber hazard.
          rm -rf gha_data && mkdir -p gha_data
          # TELEGRAM LIGHT-SWITCH POLLER (durable home): texting on/off/status to the bot flips
          # LIVE_SWITCH on $BRANCH (live_switch.sh commit+push). It used to run only on the VM /
          # local supervisor -- i.e. NOWHERE durable -- which is why texting the bot did nothing.
          # Piggybacks the always-on collect chain; getUpdates re-delivers anything sent in the
          # short gap between chained runs. Log to /tmp, NOT gha_data: exception traces can embed
          # the bot token in API URLs and gha_data is committed.
          git config user.name "switch-bot"
          git config user.email "switch-bot@users.noreply.github.com"
          timeout --signal=TERM --kill-after=30 2700 \
            python -u telegram_control.py > /tmp/telegram.log 2>&1 &
          TG=$!
          # 2520s collect + graceful TERM at 2880s (kalshi_collect handles SIGTERM -> tombstones
          # for unresolved windows) + hard KILL 60s later as the backstop.
          # cross-venue Polymarket 5-min BTC up/down in PARALLEL (lead-lag dataset for the one
          # open directional candidate; pmkt_collect was previously VM-only -> zero durable data).
          timeout --signal=TERM --kill-after=30 2700 \
            python -u pmkt_collect.py 2520 gha_data "r${{ github.run_id }}" > gha_data/pmkt.log 2>&1 &
          PMKT=$!
          # LADDER consistency shadow collector (KALSHI_GOLD_CANDIDATES.md #3): measures how often
          # multi-strike ladders (KXBTCD/KXETHD/KXINXU/KXNASDAQ100U) show crossable monotonicity
          # violations. Two weeks of this decides whether the passive-ladder-lock strategy exists.
          timeout --signal=TERM --kill-after=30 2700 \
            python -u kalshi_ladder_collect.py 2520 gha_data "r${{ github.run_id }}" > gha_data/ladder.log 2>&1 &
          LDR=$!
          # THIN/NEW-MARKET shadow collector (gold-candidates #1+#4 prospective test; Stage-B sleeves)
          timeout --signal=TERM --kill-after=30 2700 \
            python -u kalshi_thin_collect.py 2520 gha_data "r${{ github.run_id }}" > gha_data/thin.log 2>&1 &
          THN=$!
          timeout --signal=TERM --kill-after=60 2880 \
            python -u kalshi_collect.py 2520 gha_data "r${{ github.run_id }}" || true
          wait $PMKT || true
          wait $LDR || true
          wait $THN || true
          kill "$TG" 2>/dev/null || true
          tail -3 /tmp/telegram.log || true
      - name: per-run summary
        if: always()
        run: python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
      - name: P2 prospective A/B -- score this batch into a run-scoped ledger fragment
        if: always()
        run: |
          # forward test of the signal-selective-hold tie-breaker (P2_PROSPECTIVE.md, pre-registered).
          # writes gha_data/box_policy_ledger_btc_r<runid>.jsonl -> committed with the data, so the
          # A/B accumulates in the cloud. Aggregate later: box_policy_ab.py --report --dir gha_data
          for A in btc eth sol xrp; do
            python box_policy_ab.py --asset "$A" --dir gha_data \
              --ledger "gha_data/box_policy_ledger_${A}_r${{ github.run_id }}.jsonl" 2>/dev/null || true
          done
      - name: box_shadow -- forward-validation harness for decision-layer policies (pre-registered arms)
        if: always()
        run: |
          # additive, read-only shadow scorer: replays this run's freshly-collected windows through
          # the live policy plus 5 pre-registered challenger arms (hazard-based disposal stop, two
          # entry vetoes, a tighter dispose give-cap, and their combination) and appends one row per
          # (window, arm) to gha_data/box_shadow_<asset>15m.jsonl. Never touches live orders/state.
          for A in btc eth sol xrp; do
            python box_shadow.py --asset "$A" --data-dir gha_data 2>/dev/null || true
          done
      - name: commit data to the gha-data branch (worktree, shallow, date-partitioned)
        if: always()
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          test -n "$(ls -A gha_data 2>/dev/null)" || { echo "no data"; exit 0; }
          day=$(date -u +%Y-%m-%d)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "/tmp/dw/gha_data/$day"
          cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
          cd /tmp/dw
          git add gha_data
          git commit -m "gha: paper-collect r${{ github.run_id }} ($day $(date -u +%H:%MZ))" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:gha-data" && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
      - name: live watchdog -- reseed the live chain if the switch is on and no live run is active
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SELF-HEALING LIVE TRADING: live.yml self-chains, but a dead runner kills the chain and
          # the switch alone can't restart it (observed: switch=on, no live-state branch = no runs).
          # Each collect cycle: if LIVE_SWITCH (on $BRANCH, our checkout) is ON and no live.yml run
          # is queued/in_progress, dispatch one. A loss-limit kill flips the switch OFF on the
          # branch, so this NEVER re-arms after a kill (the operator re-arms deliberately).
          cd "$GITHUB_WORKSPACE"
          [ "$(tr -d '[:space:]' < LIVE_SWITCH 2>/dev/null || echo off)" = "on" ] || { echo "switch off -- no reseed"; exit 0; }
          alive=0
          for st in in_progress queued; do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/runs?status=$st&per_page=1" \
              | python -c "import sys,json; print(len(json.load(sys.stdin).get('workflow_runs',[])))" 2>/dev/null || echo 1)
            [ "$n" = "0" ] || alive=1
          done
          [ "$alive" = "0" ] || { echo "live chain alive"; exit 0; }
          code=$(curl -s -o /tmp/lw.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\"}")
          if [ "$code" = "204" ]; then echo "live chain RESEEDED"; else echo "reseed dispatch -> HTTP $code"; cat /tmp/lw.out || true; fi
      - name: self-chain -- dispatch the successor run (continuity must NOT depend on cron)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/disp.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && { echo "successor dispatched"; exit 0; }
            echo "dispatch attempt $i -> HTTP $code"; cat /tmp/disp.out || true
            sleep $((2**i))
          done
          echo "WARNING: self-dispatch failed; the cron backstop will restart the chain" >&2
