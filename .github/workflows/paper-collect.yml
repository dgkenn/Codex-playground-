# Self-healing paper-data collector on GitHub Actions (public repo => free). Container-independent.
# CRASH-PROOF continuity (every GitHub trigger is best-effort & drops; we layer + oversubscribe):
#   0) push to main = immediate, reliable SEED (no activation delay)
#   1) DENSE schedule every 5 min + concurrency(cancel-in-progress:false): runs take ~45 min, so a
#      successor is almost always QUEUED -> back-to-back, near-CONTINUOUS collection. Gaps only if
#      EVERY ~9 ticks in a run window drop. Concurrency caps at 1 running + 1 pending (no runaway).
#   2) workflow_run CHAIN: paper-collect -> paper-collect-chain (no-op) -> back (scheduler-independent)
#   3) paper-watchdog.yml = independent collect-if-stale (tight 25-min threshold, every 15 min)
#   4) DISPATCH_PAT secret = guaranteed self-dispatch even in a total scheduler outage
# OBSERVABILITY: gha_data/HEARTBEAT_*.json + optional HEARTBEAT_URL external dead-man's-switch.
# Incremental commits every ~10 min (crash-safe), unique files (no conflicts).
# NOTE: only a full GitHub-Actions outage can still stop this; true outage-proofing needs an
# external executor (user machine / VPS / external cron hitting the dispatch API) -- see WATCHER.md.
name: paper-collect

on:
  push:
    branches: [main]            # immediate seed on any main commit (reliable; no schedule delay)
  schedule:
    - cron: '*/5 * * * *'       # DENSE: oversubscribe so a successor is always queued (concurrency dedups)
  workflow_dispatch: {}
  workflow_run:
    workflows: ["paper-collect-chain"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-btc-backtest-XZkKI
  HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install --quiet numpy scipy requests websockets
      - name: collect ~45 min with incremental commits (crash-safe)
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          mkdir -p gha_data
          incr () {
            git add gha_data/ 2>/dev/null || return 0
            git diff --cached --quiet && return 0
            git commit -q -m "gha: paper-collect r${{ github.run_id }} ($(date -u +%H:%MZ))" || return 0
            git push -q origin "HEAD:$BRANCH" 2>/dev/null || true
          }
          ( for k in 1 2 3 4; do sleep 600; incr; done ) &
          LOOP=$!
          timeout 2700 python -u shadow_compare.py --duration 2640 \
            --tag "r${{ github.run_id }}" --out-dir gha_data || true
          kill $LOOP 2>/dev/null || true
          python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
          git add gha_data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "gha: paper-collect r${{ github.run_id }} final"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
            sleep $((RANDOM % 6 + 2))
          done
      - name: bounce the chain (re-arm continuity) + optional PAT self-chain
        if: ${{ always() }}
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            curl -s -X POST -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paper-collect.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
