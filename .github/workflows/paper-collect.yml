# Self-healing paper-data collector on GitHub Actions (public repo => free). Container-independent.
# CRASH-PROOF continuity. HARD LESSON: GitHub drops even a */5 schedule wholesale (observed
# multi-HOUR gaps when the chain dropped and the scheduler didn't rescue). So the real fix is to
# MINIMIZE trigger-dependence: each run collects ~5h, so we only need a trigger every ~5h instead
# of every ~45min (~7x fewer). Layers, in order of reliability:
#   0) push to main = immediate reliable SEED
#   1) LONG run (~5h) + incremental commits every 10 min -> one run covers a 5h trigger-gap
#   2) workflow_run CHAIN (paper-collect <-> paper-collect-chain), scheduler-independent
#   3) schedule */5 + concurrency(cancel-in-progress:false) -> fast restart after a run ends
#   4) paper-watchdog.yml = independent collect-if-stale (25-min threshold, every 15 min)
#   5) DISPATCH_PAT secret = GUARANTEED self-dispatch (the only zero-gap layer; add it to eliminate
#      gaps entirely -- without it, gaps are bounded to ~one watchdog cycle per ~5h run instead of hours)
# OBSERVABILITY: gha_data/HEARTBEAT_*.json + optional HEARTBEAT_URL external dead-man's-switch.
# Only a full GitHub-Actions outage can still stop this; true outage-proofing needs an external
# executor (VPS / external cron hitting the dispatch API) -- see WATCHER.md.
name: paper-collect

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'       # fast restart after a run ends (concurrency dedups while one runs)
  workflow_dispatch: {}
  workflow_run:
    workflows: ["paper-collect-chain"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-btc-backtest-XZkKI
  HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # ~5.5h (< 6h job cap); covers the ~5h collection + final flush
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install --quiet numpy scipy requests websockets
      - name: collect ~5h with incremental commits (crash-safe, minimizes trigger-dependence)
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          mkdir -p gha_data
          # DATA -> dedicated `gha-data` branch via a worktree, so the ~10-min incremental commits NEVER
          # touch (or clobber) the code branch. The code checkout stays on the feature branch; shadow_compare
          # writes ./gha_data and push_data mirrors it into the gha-data worktree. (Old design pushed onto
          # the code branch every 10 min and clobbered code commits.) Analysis: see sync_data.sh.
          git fetch origin gha-data 2>/dev/null || true
          git worktree add -B gha-data /tmp/dw origin/gha-data 2>/dev/null || git worktree add --orphan -b gha-data /tmp/dw
          mkdir -p /tmp/dw/gha_data
          push_data () {
            cp -r gha_data/. /tmp/dw/gha_data/ 2>/dev/null || true
            ( cd /tmp/dw
              git add gha_data 2>/dev/null || return 0
              git diff --cached --quiet && return 0
              git commit -q -m "gha: paper-collect r${{ github.run_id }} ($(date -u +%H:%MZ))" || return 0
              for i in 1 2 3; do
                git pull --rebase --autostash -q origin gha-data 2>/dev/null || true
                git push -q origin HEAD:gha-data 2>/dev/null && break
                sleep 3
              done )
          }
          ( for k in $(seq 1 30); do sleep 600; push_data; done ) &
          LOOP=$!
          timeout 18300 python -u shadow_compare.py --duration 18000 \
            --tag "r${{ github.run_id }}" --out-dir gha_data || true
          kill $LOOP 2>/dev/null || true
          python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
          push_data
      - name: bounce the chain (re-arm continuity) + optional PAT self-chain
        if: ${{ always() }}
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            curl -s -X POST -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paper-collect.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
