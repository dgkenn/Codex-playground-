# Self-healing paper-data collector on GitHub Actions (public repo => free). Container-independent.
# CONTINUITY layers (GitHub's `schedule` is best-effort and drops runs):
#   1) schedule every 30 min (seed + backup)
#   2) workflow_run CHAIN: paper-collect finishes -> paper-collect-chain (no-op) fires -> its
#      completion re-triggers paper-collect => continuous ping-pong, scheduler-INDEPENDENT, no PAT.
#   3) paper-watchdog.yml = independent collect-if-stale (covers a broken chain + dropped crons)
#   4) optional PAT self-chain (DISPATCH_PAT secret) = guaranteed even in a total scheduler outage
# Each run: incremental commits every ~10 min (crash-safe) of UNIQUE files (gha_data/shadow_windows_r*).
name: paper-collect

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  workflow_run:
    workflows: ["paper-collect-chain"]   # bounced back here -> continuous chain (no PAT needed)
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-btc-backtest-XZkKI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install --quiet numpy scipy requests websockets
      - name: collect ~45 min with incremental commits (crash-safe)
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          mkdir -p gha_data
          incr () {
            git add gha_data/ 2>/dev/null || return 0
            git diff --cached --quiet && return 0
            git commit -q -m "gha: paper-collect r${{ github.run_id }} ($(date -u +%H:%MZ))" || return 0
            git push -q origin "HEAD:$BRANCH" 2>/dev/null || true
          }
          ( for k in 1 2 3 4; do sleep 600; incr; done ) &
          LOOP=$!
          timeout 2700 python -u shadow_compare.py --duration 2640 \
            --tag "r${{ github.run_id }}" --out-dir gha_data || true
          kill $LOOP 2>/dev/null || true
          python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
          git add gha_data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "gha: paper-collect r${{ github.run_id }} final"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
            sleep $((RANDOM % 6 + 2))
          done
      - name: bounce the chain (re-arm continuity) + optional PAT self-chain
        if: ${{ always() }}
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          # Built-in GITHUB_TOKEN dispatch does NOT start a run (anti-recursion); the workflow_run
          # CHAIN handles continuity without a PAT. If a PAT is present, also direct-dispatch (belt).
          if [ -n "$PAT" ]; then
            curl -s -X POST -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/paper-collect.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
