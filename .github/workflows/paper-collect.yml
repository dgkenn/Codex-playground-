# Robust, self-healing paper-data collection on GitHub Actions (public repo => free/unlimited).
# Runs the 7-variant shadow comparison each hour on GitHub's infra -- independent of the ephemeral
# dev container, so it survives container reclamation with ZERO manual restarts. INCREMENTAL commits
# every ~10 min => a killed runner costs <=10 min and even partial runs contribute. Each run writes
# UNIQUE files (gha_data/shadow_windows_r<run_id>.jsonl) -> never conflicts. READ-ONLY paper sim
# (public Polymarket WS + Coinbase spot, NO keys). Aggregate: python aggregate_shadow.py
name: paper-collect

on:
  schedule:
    - cron: '7 * * * *'          # hourly at :07 (offset dodges top-of-hour cron congestion)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:                      # never overlap; let an in-flight run finish
  group: paper-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-btc-backtest-XZkKI

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58           # < 60 so the hourly schedule never overlaps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install --quiet numpy scipy requests websockets
      - name: collect ~47 min with incremental commits (crash-safe)
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          mkdir -p gha_data
          # INCREMENTAL: plain add/commit/push only -- never touches the working tree while the
          # collector is appending (no rebase/autostash mid-write => no corruption). A non-ff
          # push just fails harmlessly; the final flush reconciles.
          incr () {
            git add gha_data/ 2>/dev/null || return 0
            git diff --cached --quiet && return 0
            git commit -q -m "gha: paper-collect r${{ github.run_id }} ($(date -u +%H:%MZ))" || return 0
            git push -q origin "HEAD:$BRANCH" 2>/dev/null || true
          }
          ( for k in 1 2 3 4; do sleep 600; incr; done ) &
          LOOP=$!
          timeout 2820 python -u shadow_compare.py --duration 2760 \
            --tag "r${{ github.run_id }}" --out-dir gha_data || true
          kill $LOOP 2>/dev/null || true
          python aggregate_shadow.py > gha_data/SUMMARY.txt 2>/dev/null || true
          # FINAL flush: collector has exited, so rebase-retry is safe (reconciles any race).
          git add gha_data/ 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "gha: paper-collect r${{ github.run_id }} final"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
            sleep $((RANDOM % 6 + 2))
          done
