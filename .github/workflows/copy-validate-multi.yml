# Overnight: validate prospective trade-prediction for ALL top-10% MM wallets at once (shared WS book).
# Each hour runs one ~47-min copy_live_multi cycle and commits copy_multi_result_<runid>.json to the
# gha-data branch; across the night every wallet accumulates fills (copy_agg pools the per-wallet verdict).
# Read-only. See copy_live_multi.py / STRATEGIES.md.
name: copy-validate-multi

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: copy-validate-multi
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests websockets
      - name: run one multi-wallet cycle (~47 min)
        run: |
          test -f mm_score.json || python mm_score.py || true   # needs makers cache; skip if absent
          timeout 2820 python copy_live_multi.py 2760 || true
      - name: commit per-wallet results to the gha-data DATA branch
        run: |
          test -f copy_multi_result.json || { echo "no result"; exit 0; }
          git config user.name paper-bot; git config user.email paper-bot@users.noreply.github.com
          cp copy_multi_result.json "/tmp/cm_${{ github.run_id }}.json"
          git fetch origin gha-data 2>/dev/null || true
          git worktree add -B gha-data /tmp/dw origin/gha-data 2>/dev/null || git worktree add --orphan -b gha-data /tmp/dw
          mkdir -p /tmp/dw/copy_multi_results
          cp "/tmp/cm_${{ github.run_id }}.json" /tmp/dw/copy_multi_results/
          cd /tmp/dw && git add copy_multi_results
          git commit -q -m "copy-validate-multi ${{ github.run_id }} $(date -u +%H:%MZ)" || { echo nothing; exit 0; }
          for i in 1 2 3; do git pull --rebase --autostash -q origin gha-data 2>/dev/null || true; git push -q origin HEAD:gha-data && break; sleep 3; done
