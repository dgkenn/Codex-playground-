# Overnight 1:1 reconstruction: each hour record ~47 min of the top-5 wallets' fills WITH exact
# microstructure (WS book) and APPEND to strategy_fine.jsonl on the gha-data branch. Across the night
# this accumulates enough fills to reconstruct each wallet's exact placement function (offset/size/
# set-sum/inventory rules) -- run `python strategy_fine.py --analyze` on the pooled file. Read-only.
name: strategy-fine

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: strategy-fine
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests websockets
      - name: record ~47min of top-5 wallets' fills + exact microstructure
        run: |
          test -f mm_score.json || python mm_score.py || true
          W=$(python -c "import json;print(','.join(r['w'] for r in json.load(open('mm_score.json'))[:5]))" 2>/dev/null)
          # pull existing pooled file from gha-data so we append, not overwrite
          git fetch origin gha-data 2>/dev/null && git checkout origin/gha-data -- strategy_fine.jsonl 2>/dev/null || true
          timeout 2820 python strategy_fine.py 2760 "$W" || true
      - name: commit pooled fills to gha-data
        run: |
          test -f strategy_fine.jsonl || { echo "no fills"; exit 0; }
          git config user.name paper-bot; git config user.email paper-bot@users.noreply.github.com
          cp strategy_fine.jsonl /tmp/sf.jsonl
          git fetch origin gha-data 2>/dev/null || true
          git worktree add -B gha-data /tmp/dw origin/gha-data 2>/dev/null || git worktree add --orphan -b gha-data /tmp/dw
          cp /tmp/sf.jsonl /tmp/dw/strategy_fine.jsonl
          cd /tmp/dw && git add strategy_fine.jsonl
          git commit -q -m "strategy-fine ${{ github.run_id }} $(date -u +%H:%MZ)" || { echo nothing; exit 0; }
          for i in 1 2 3; do git pull --rebase --autostash -q origin gha-data 2>/dev/null || true; git push -q origin HEAD:gha-data && break; sleep 3; done
