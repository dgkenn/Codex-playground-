# box-shadow forward-validation runner -- THE MISSING SCHEDULER (added 2026-07-13).
#
# box_shadow.py is a READ-ONLY replay harness (stdlib+numpy, no keys, no orders) that scores the
# pre-registered DECISION-LAYER arms (live / hazard_stop / thickbook_veto / cell_veto / givecap15 /
# combined / stack_full / stack_lean) one row per (asset, window, arm) over already-collected tick
# tapes. FORWARD_LEDGER.md described these arms as "accruing from 2026-07-13", but NOTHING was
# scheduled to actually RUN box_shadow.py -- so zero forward rows existed and the ~2026-07-23
# promotion gate had no data. This workflow closes that gap.
#
# It is a REPLAY, not a live poll loop: each run processes a TRAILING WINDOW of recently-collected
# days (yesterday back 7 days) in ascending order. box_shadow.py is idempotent -- existing_keys_for()
# dedups per (asset, ws, arm), so re-processing the same days only fills gaps, never double-writes;
# and ascending order lets thickbook_veto's rolling-5-day qdepth percentile read the earlier days'
# rows written in the same batch. Once daily is plenty (a completed day never changes).
#
# Data path: ticks live on the gha-data branch (ticks_kalshi_btc15m_*.jsonl.gz + shadow_windows for
# settlement). Same worktree idiom as boxwide-paper.yml / sidecar-feeds.yml: check out CODE from
# $BRANCH, worktree the gha-data branch, run box_shadow.py against that worktree (so it reads the
# ticks in place and writes box_shadow_btc15m.jsonl beside them), commit back to gha-data.
#
# Scope: BTC only -- the live bot is BTC-only and the promotion gate (FORWARD_LEDGER.md) is BTC.
# Pull results: git fetch origin gha-data && git show origin/gha-data:gha_data/<day>/box_shadow_btc15m.jsonl
# Score:        python box_shadow_report.py (bot branch) over the gha-data box_shadow rows.
#
# CRON OFFSET (minute crons this dodges): collect=9,29,49 / live=3,28,53 / health=14,44 /
# strategy-alert=17 / wallet-track=23 / sidecar-feeds=6,36 / tailbias-paper=11,41 / boxwide=13,43.
# This one is DAILY at 02:47 UTC -- yesterday's ticks are fully collected + committed by then.
name: box-shadow

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: box-shadow
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  box-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet numpy && break; sleep 10; done
      - name: replay decision-layer arms over the trailing week + commit to gha-data
        if: always()
        run: |
          set -e
          git config user.name  "box-shadow-bot"
          git config user.email "box-shadow-bot@users.noreply.github.com"
          # worktree the gha-data branch (ticks live there); same idiom as boxwide-paper.yml
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            echo "no gha-data branch yet -> nothing to replay"; exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          # trailing window: yesterday back 7 days, ASCENDING (rolling-threshold reads earlier days first)
          DAYS=""
          for i in 7 6 5 4 3 2 1; do DAYS="$DAYS $(date -u -d "$i days ago" +%F)"; done
          echo "replaying days:$DAYS"
          # BTC = the live sleeve; ETH added 2026-07-13 (node F1b) to forward-validate ETH's
          # box economics — ETH is BTC-tier for pairing (pair_ever 87.6% vs 88.3%) and trades
          # WIDER (30% of fills at 2-3c spread, pairing intact), a potential higher-edge sleeve.
          # The 'live'-arm ETH rows are the viability measurement; the decision-layer arms on ETH
          # are exploratory (their hazard/threshold constants were fit on BTC).
          python -u box_shadow.py --asset btc eth --data-dir /tmp/dw/gha_data --day $DAYS || true
          cd /tmp/dw
          # commit only the box_shadow output (ticks are already on the branch; don't re-add them)
          git add gha_data/*/box_shadow_btc15m.jsonl gha_data/*/box_shadow_eth15m.jsonl 2>/dev/null || true
          git commit -m "box-shadow forward rows $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
