# Bouncer for the continuity CHAIN. A workflow can't trigger on its OWN completion, so this
# tiny no-op exists only to bounce: paper-collect completes -> this fires -> its completion
# re-triggers paper-collect (which listens for paper-collect-chain). Net effect: paper-collect
# runs back-to-back continuously, independent of GitHub's flaky `schedule`, with NO PAT needed.
# Seeded by paper-collect's first scheduled/manual run; thereafter self-perpetuating.
name: paper-collect-chain

on:
  workflow_run:
    workflows: ["paper-collect"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: paper-collect-chain
  cancel-in-progress: false

jobs:
  bounce:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "paper-collect completed -> bouncing to re-arm the collector (continuity chain)"
          sleep 5
