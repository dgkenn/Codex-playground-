# Robust, self-healing READ-ONLY collection of KALSHI CRYPTO PERPETUALS on GitHub Actions.
#
# WHY: we want perp-based (carry/basis) return drivers -- ORTHOGONAL to our validated FAVLONG binary
# edge. No perp data exists yet, so this workflow just starts ACCRUING it (collect-then-forward-
# validate the three paper edges in perp_strategy_design.md). It runs kalshi_perp_collect.py, which
# DISCOVERS the live crypto perps on external-api.kalshi.com (/margin/markets) and polls their
# top-of-book + index(BRTI) + mark + funding-rate + OI/volume. READ-ONLY: it never places an order,
# never touches LIVE_SWITCH/live.yml/live_switch.sh. Market data only.
#
# MODELED ON collect.yml (same always-on design), but STRIPPED of every write/trade side effect:
#   * SELF-CHAIN: each run dispatches its successor (continuity does not depend on cron).
#   * THREE crons/hour are the chain-restart backstop. Minutes 1,21,41 DODGE the existing schedules
#     (collect=:9,29,49 / live=:3,28,53 / box-shadow=:47 / favlong=:33 6h / sports-alert=:17 /
#     kalshi-longshot=:14,44) so runners don't pile onto the same tick.
#   * non-cancelling concurrency group: chained + cron runs queue back-to-back, never overlap.
#   * `timeout --signal=TERM` + the collector's SIGTERM graceful-drain: files are closed cleanly.
#   * commit step (if: always()) writes gzip outputs into a WORKTREE on the `gha-data` branch, shallow
#     + date-partitioned (gha_data/YYYY-MM-DD/...), identical to collect.yml's data-commit logic.
#   * NO live watchdog, NO telegram poller, NO order path -- deliberately absent (read-only).
#
# GitHub fires schedule/workflow_dispatch only from the DEFAULT branch (main), so THIS FILE must live
# on main. It checks out CODE (kalshi_perp_collect.py) from $BRANCH and commits DATA to `gha-data`.
# Pull data for analysis:
#   git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
#
# NOTE ON THE ALIGNED BINARY MID: collect.yml already collects the rich ticks_kalshi_<asset>15m
# streams, but on a DIFFERENT cron minute -> not time-aligned to these perp polls. So this collector
# ALSO snapshots the 15m-binary YES mid for btc/eth/sol/xrp on the SAME clock as each perp poll
# (ticks_kalshi_perp_binmid_<asset>_*.jsonl.gz), which is what the perp<->binary basis edge needs.
#
# AUTH: the perp READ endpoints are currently PUBLIC (no key needed -- verified 2026-07-15). The
# KALSHI secrets are wired anyway (signed onto every request when present) so collection keeps
# working unchanged if Kalshi later gates these behind auth. Missing secrets => still collects
# (public reads); it never fails the run.

name: kalshi-perp-collect

on:
  schedule:
    - cron: '1,21,41 * * * *'     # chain-restart backstop; minutes dodge every existing schedule
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write                  # self-chain: each run dispatches its successor

concurrency:
  group: kalshi-perp-collect
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5   # the CODE branch with kalshi_perp_collect.py

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: |
          for i in 1 2 3; do pip install --quiet requests cryptography && break; sleep 10; done
      - name: collect ~42 min of Kalshi crypto PERPETUALS (discovery-driven, gzipped, SIGTERM-safe)
        env:
          # Optional -- perp reads are public today; signed onto requests when present (future-proof).
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          # START CLEAN: the code-branch checkout may carry legacy tracked gha_data; committing it
          # onto gha-data every run is dead weight and a stale-clobber hazard.
          rm -rf gha_data && mkdir -p gha_data
          # Materialize the RSA PEM to a 0600 temp file (multiline secret) and point the collector at
          # it; shred after. Harmless if the secret is unset -- the collector runs keyless on the
          # public reads. (Same key-handling pattern as live.yml, but READ-ONLY here.)
          if [ -n "$KALSHI_PRIVATE_KEY" ]; then
            printf '%s\n' "$KALSHI_PRIVATE_KEY" > "$RUNNER_TEMP/k.pem"
            chmod 600 "$RUNNER_TEMP/k.pem"
            export KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/k.pem"
          fi
          # 2520s collect + graceful TERM at 2880s (collector handles SIGTERM -> closes gzip cleanly)
          # + hard KILL 60s later as the backstop.
          timeout --signal=TERM --kill-after=60 2880 \
            python -u kalshi_perp_collect.py 2520 gha_data "r${{ github.run_id }}" || true
          shred -u "$RUNNER_TEMP/k.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/k.pem" 2>/dev/null || true
      - name: commit data to the gha-data branch (worktree, shallow, date-partitioned)
        if: always()
        run: |
          git config user.name  "perp-bot"
          git config user.email "perp-bot@users.noreply.github.com"
          test -n "$(ls -A gha_data 2>/dev/null)" || { echo "no data"; exit 0; }
          day=$(date -u +%Y-%m-%d)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "/tmp/dw/gha_data/$day"
          cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
          cd /tmp/dw
          git add gha_data
          git commit -m "gha: kalshi-perp-collect r${{ github.run_id }} ($day $(date -u +%H:%MZ))" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6; do
            git push origin "HEAD:gha-data" && exit 0
            # Files are uniquely named per run_id, so the safe retry is: rebuild the worktree from the
            # fresh remote tip and re-commit -- no rebase, no conflicts possible (collect.yml pattern).
            sleep $((RANDOM % 8 + 2))
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/dw 2>/dev/null || rm -rf /tmp/dw
            rm -f .git/shallow.lock
            git fetch --depth=1 origin gha-data || true
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
            mkdir -p "/tmp/dw/gha_data/$day"
            cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
            git add gha_data
            git commit -m "gha: kalshi-perp-collect r${{ github.run_id }} ($day $(date -u +%H:%MZ)) retry$i" \
              || { echo "nothing to commit"; exit 0; }
          done
          echo "push failed after retries" >&2; exit 1
      - name: self-chain -- dispatch the successor run (continuity must NOT depend on cron)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/disp.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kalshi-perp-collect.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && { echo "successor dispatched"; exit 0; }
            echo "dispatch attempt $i -> HTTP $code"; cat /tmp/disp.out || true
            sleep $((2**i))
          done
          echo "WARNING: self-dispatch failed; the cron backstop will restart the chain" >&2
