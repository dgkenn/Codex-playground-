# INDEPENDENT durability monitor for all data collection. Separate failure domain from collect.yml:
# if the collect self-chain AND its crons all die, THIS still runs (own cron) and (a) Telegram-alerts
# you, (b) re-dispatches collect.yml as a THIRD restart path. Read-only on data; no money.
#
#   - Runs health_check.py (git-based freshness of every collected stream on the gha-data branch).
#   - On CRITICAL (collection stalled >130 min): alert + reseed the collect chain.
#   - Once/day (~14:14 UTC): a "collectors healthy" heartbeat so SILENCE never means "is it dead?".
#   - Runs pnl_guard.py (statistical P&L variance guard, ESCALATION_PLAN.md MONITORING section):
#     Telegram-alerts on SEV-AMBER/SEV-RED. Read-only guard: reports only, never touches
#     LIVE_SWITCH/bankroll/the ladder step -- de-escalation on SEV-RED is an OPERATOR action.
#   - Runs activity_guard.py (2026-07-13 incident fix: 38h zero-placements while every other check
#     said "running"). Telegram-alerts on SEV-AMBER/SEV-RED like pnl_guard, AND opens/updates a
#     tracking GitHub issue ("BOT-INACTIVE: zero placements during active hours") that the daily
#     improvement cycle reads as its debugging queue -- and self-heals (comments + closes) that
#     issue once activity resumes.
#
# Like the others, this file must live on the DEFAULT branch (main) for its schedule to fire; it
# checks out CODE (health_check.py, notify.py, pnl_guard.py, activity_guard.py) from $BRANCH.
name: health

on:
  schedule:
    - cron: '14,44 * * * *'    # every 30 min, offset clear of collect(9,29,49)/live(3,28,53)/alert(17)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write               # reseed: dispatch collect.yml if collection is dead
  issues: write                 # activity_guard debugging-loop trigger: open/comment/close BOT-INACTIVE issue

concurrency:
  group: health
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet requests && break; sleep 5; done
      - name: check freshness + alert + (daily) heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # need the data branch ref locally for the git-based checks
          git fetch origin gha-data -q || true
          FLAGS="--alert"
          # daily passive-assurance heartbeat on the :14 run during the 14:00 UTC hour
          if [ "$(date -u +%H)" = "14" ] && [ "$(date -u +%M)" -lt 30 ]; then FLAGS="$FLAGS --heartbeat"; fi
          rc=0; python health_check.py $FLAGS || rc=$?
          echo "health_check rc=$rc"
          if [ "$rc" = "2" ]; then
            echo "CRITICAL -> reseeding collect chain via independent dispatch"
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/h.out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
                -d '{"ref":"main"}')
              [ "$code" = "204" ] && { echo "collect chain reseeded"; break; }
              echo "reseed attempt $i -> HTTP $code"; cat /tmp/h.out || true; sleep $((2**i))
            done
          fi
          exit 0    # never fail the monitor itself (it already alerted)
      - name: live-watchdog (re-dispatch live.yml if switch=on and its chain stalled)
        # THIRD restart path for the live money bot, independent of live.yml's own cron (3,28,53) and
        # self-chain -- both depend on GitHub's cron firing, which is unreliable (skipped slots have
        # delayed the FIRST start / chain-death recovery by 50+ min). Same pattern as the CRITICAL ->
        # reseed block above, but targets live.yml. Read-only guard: never flips LIVE_SWITCH, never
        # dispatches when the switch is off.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # LIVE_SWITCH is already on disk: the checkout at the top of this job targets $BRANCH, the
          # same branch live.yml itself reads the switch from -- no extra fetch needed.
          sw=$(tr -d '[:space:]' < LIVE_SWITCH 2>/dev/null || echo off)
          echo "live switch = $sw"
          if [ "$sw" != "on" ]; then
            echo "switch off -> nothing to guard"
            exit 0
          fi

          healthy=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/runs?per_page=1" \
            | python3 -c "import sys,json,datetime as dt; d=json.load(sys.stdin); r=(d.get('workflow_runs') or [{}])[0]; s=r.get('status'); t=r.get('updated_at') or r.get('created_at'); ok=s=='in_progress' or (s=='completed' and t and (dt.datetime.now(dt.timezone.utc)-dt.datetime.strptime(t,'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=dt.timezone.utc)).total_seconds()<1800); print('yes' if ok else 'no')" \
            2>/dev/null) || healthy=no
          echo "live chain healthy (in_progress or completed <30m ago)? ${healthy:-no}"
          if [ "$healthy" = "yes" ]; then
            echo "live chain healthy -> no action"
            exit 0
          fi

          echo "switch=on but live.yml chain looks stalled -> re-dispatching (independent restart path)"
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/lw.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
              -d '{"ref":"main"}') || code=""
            [ "$code" = "204" ] && { ok=1; echo "live chain re-dispatched"; break; }
            echo "live re-dispatch attempt $i -> HTTP $code"; cat /tmp/lw.out || true; sleep $((2**i))
          done
          if [ "$ok" = "1" ]; then
            python3 -c "import notify; notify.alert_sync('live watchdog: chain stalled with switch=on -> re-dispatched')" || true
          else
            python3 -c "import notify; notify.alert_sync('CRITICAL: live watchdog re-dispatch FAILED 3x with switch=on -- live chain may be dead')" || true
          fi
          exit 0    # never fail the monitor itself (it already alerted)
      - name: pnl variance guard (statistical P&L guard -- ESCALATION_PLAN.md MONITORING)
        # Thresholds are PRE-REGISTERED in ESCALATION_PLAN.md on $BRANCH; this step only runs the
        # script and forwards its verdict -- it does not decide/tune thresholds itself. Same
        # Telegram mechanism as every other step in this file (notify.alert_sync, same secrets).
        # SEV-RED also implies the de-escalation rule in ESCALATION_PLAN.md's "De-escalation"
        # section, but that's an OPERATOR action off the back of the alert, not something this
        # workflow does automatically (this step is read-only, like live-watchdog above).
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in 1 2 3; do pip install --quiet numpy && break; sleep 5; done
          rc=0; out=$(OMP_NUM_THREADS=2 python3 pnl_guard.py 2>&1) || rc=$?
          echo "pnl_guard rc=$rc"
          echo "$out"
          if [ "$rc" = "10" ] || [ "$rc" = "20" ]; then
            export PNL_GUARD_MSG="$out"
            if [ "$rc" = "20" ]; then export PNL_GUARD_MSG="*** SEV-RED *** $out"; fi
            python3 -c "import os, notify; notify.alert_sync(os.environ['PNL_GUARD_MSG'])" || true
          fi
          exit 0    # never fail the monitor itself (guard failures aren't collection/live failures)
      - name: activity guard (bot-inactive detector -- 2026-07-13 38h-zero-placements incident fix)
        # activity_guard.py is stdlib-only (no numpy dependency needed for its counting logic), so
        # no extra pip install step. Same Telegram mechanism as pnl_guard above. ADDITIONALLY opens
        # the debugging-loop trigger: SEV-AMBER/SEV-RED create-or-comment a tracking issue (the
        # daily improvement cycle's debugging queue is "open issues"); a later OK-with-activity run
        # self-heals by commenting + closing that issue. Read-only on trading state: never touches
        # LIVE_SWITCH/bankroll/the ladder step, only files/updates the issue and alerts.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0; out=$(OMP_NUM_THREADS=2 python3 activity_guard.py 2>&1) || rc=$?
          echo "activity_guard rc=$rc"
          echo "$out"
          TITLE="BOT-INACTIVE: zero placements during active hours"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          find_open_issue() {
            gh issue list --state open --json number,title --jq \
              ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -1
          }

          if [ "$rc" = "10" ] || [ "$rc" = "20" ]; then
            export ACTIVITY_GUARD_MSG="$out"
            if [ "$rc" = "20" ]; then export ACTIVITY_GUARD_MSG="*** SEV-RED *** $out"; fi
            python3 -c "import os, notify; notify.alert_sync(os.environ['ACTIVITY_GUARD_MSG'])" || true

            num=$(find_open_issue)
            body="**[$TS UTC] activity_guard exit=$rc**

          \`\`\`
          $out
          \`\`\`"
            if [ -n "$num" ]; then
              echo "existing open issue #$num -> commenting"
              gh issue comment "$num" --body "$body" || true
            else
              echo "no open issue -> creating"
              gh issue create --title "$TITLE" --body "$body" || true
            fi
          elif echo "$out" | grep -q "placements="; then
            plc=$(echo "$out" | grep -oP 'placements=\K[0-9]+' | head -1)
            if [ -n "$plc" ] && [ "$plc" -gt 0 ]; then
              num=$(find_open_issue)
              if [ -n "$num" ]; then
                echo "activity restored -> commenting + closing open issue #$num"
                gh issue comment "$num" --body "**[$TS UTC]** activity restored :: $out" || true
                gh issue close "$num" --reason completed || true
              fi
            fi
          fi
          exit 0    # never fail the monitor itself (guard failures aren't collection/live failures)
