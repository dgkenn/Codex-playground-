# Independent, READ-ONLY Kalshi account snapshot + PORTFOLIO-LEVEL guardian -- the dead-man audit's
# ground-truth check, now running intra-day instead of once a day.
# kalshi_trader.py's own P&L ledger lives in-process only and resets on every restart, and never
# re-adopts venue-side positions on startup (see DEADMAN_AUDIT.md on the live-ready branch) -- it can
# silently drift from the venue's true account state across a runner death, with nothing else
# watching. This workflow is a SEPARATE accounting path: several times a day it pulls the account's
# own balance + open positions directly (equity_snap.py -- GET-only, no order-placing code anywhere
# in that file) and commits the snapshot to the gha-data branch, so a drift between "what the bot
# thinks it has" and "what Kalshi actually holds" is independently observable even if the trader (or
# its own telemetry) goes dark.
#
# It then runs portfolio_guardian.py -- also GET-only -- the PORTFOLIO-level counterpart to
# kalshi_trader.py's PER-ASSET rails ($6 sticky loss-limit each). Correlated crypto sleeves can each
# trip their own per-asset limit without any single one seeing the whole account, and nothing
# previously watched balance drawdown across days. portfolio_guardian.py checks daily drawdown,
# all-time drawdown, and open-notional exposure; on a CRITICAL drawdown it durably flips
# LIVE_SWITCH=off via the GitHub contents API (the same mechanism kalshi_trader.remote_switch_kill()
# uses) and alerts Telegram. See portfolio_guardian.py's module docstring for the exact rules.
#
# CADENCE: every 6 hours (was once daily) so the guardian catches an intra-day blowup, not just a
# day-old one. The snapshot step already APPENDS (not overwrites), so multiple rows/day landing in
# the same gha_data/equity_<date>.jsonl file is expected and handled (both equity_snap.py's writer
# and portfolio_guardian.py's reader treat the LAST row of a date as that day's snapshot).
#
# SAFE BY DEFAULT: missing KALSHI_* secrets -> equity_snap.py / portfolio_guardian.py print "no
# secrets, skipping" and exit 0 (same fail-closed posture as live.yml). GitHub only fires
# schedule/workflow_dispatch from the file on the DEFAULT branch, so this file lives on main; it
# checks out CODE from $BRANCH but commits SNAPSHOT DATA to gha-data (never the code branch). The
# guardian's only other possible write, anywhere, is a LIVE_SWITCH=off PUT on $BRANCH via the
# contents API -- never a code change, never "on".
name: equity-snapshot

on:
  schedule:
    - cron: '37 3,9,15,21 * * *'   # every 6h (was daily 21:37) so the guardian catches intra-day
                                    # drawdown; minute :37 doesn't collide with any other cron in
                                    # this repo (collect 9,29,49 / health 14,44 / live 3,28,53 /
                                    # sidecar 6,36 / strategy-alert 17 / wallet-track 23 */6, etc.)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: equity-snapshot
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet requests cryptography && break; sleep 10; done
      - name: seed prior snapshots from gha-data (so the Telegram digest can compute a delta)
        run: |
          mkdir -p gha_data
          git fetch --depth=1 origin gha-data 2>/dev/null && \
            git checkout origin/gha-data -- gha_data 2>/dev/null || true
      - name: snapshot balance + positions (read-only; no-ops cleanly if secrets are absent)
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          umask 077
          if [ -n "$KALSHI_PRIVATE_KEY" ]; then
            printf '%s\n' "$KALSHI_PRIVATE_KEY" > "$RUNNER_TEMP/k.pem"
            chmod 600 "$RUNNER_TEMP/k.pem"
            export KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/k.pem"
          fi
          python equity_snap.py
          shred -u "$RUNNER_TEMP/k.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/k.pem"
      - name: portfolio guardian (read-only; may flip LIVE_SWITCH=off on a CRITICAL drawdown)
        if: always()             # independent read of its own -- must run even if the snapshot
                                  # step above failed to reach Kalshi this cycle
        continue-on-error: true  # a guardian hiccup (e.g. a transient API error) must never fail
                                  # this workflow or block the commit step below
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}   # contents:write (see `permissions:` above) -- durable
                                           # LIVE_SWITCH=off PUT only; REMOTE_SWITCH_URL is built
                                           # from GITHUB_REPOSITORY (auto env) + $BRANCH (above)
        run: |
          umask 077
          if [ -n "$KALSHI_PRIVATE_KEY" ]; then
            printf '%s\n' "$KALSHI_PRIVATE_KEY" > "$RUNNER_TEMP/g.pem"
            chmod 600 "$RUNNER_TEMP/g.pem"
            export KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/g.pem"
          fi
          python portfolio_guardian.py
          shred -u "$RUNNER_TEMP/g.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/g.pem"
      - name: commit snapshot to the gha-data branch (worktree, shallow, never the code branch)
        if: always()
        run: |
          git config user.name  "equity-bot"
          git config user.email "equity-bot@users.noreply.github.com"
          test -n "$(ls -A gha_data 2>/dev/null)" || { echo "no data"; exit 0; }
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data
          cp -f "$GITHUB_WORKSPACE"/gha_data/equity_*.jsonl /tmp/dw/gha_data/ 2>/dev/null || true
          cd /tmp/dw
          git add gha_data
          git commit -m "equity snap $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
