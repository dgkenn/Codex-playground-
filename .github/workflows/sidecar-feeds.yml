# Sidecar data-gap collector: runs alongside collect.yml (NOT part of it) so the three gaps below
# get closed without adding runner-minutes to the main collect chain. ONE process, three independent
# asyncio capture loops (sidecar_feeds.py, on the code branch -- READ its docstring for the full
# design rationale):
#   1. COMPOSITE SPOT   -- Binance + Coinbase best bid/ask, 1s-resolution composite mid + cross-venue
#                          spread_bps. A fair-value anchor independent of Kalshi's own book.
#   2. WS LATENCY STAMPS -- Kalshi's own authenticated market-data WS (ticker channel, KX*15M), every
#                          ~10th timestamped message logged as {ts_venue, ts_local, lag_ms}. Quantifies
#                          GitHub-Actions-runner latency to Kalshi before any VPS-migration decision.
#   3. MACRO CALENDAR   -- once per run, next 7 days of CPI/FOMC/NFP/PPI/GDP (pre-known vol regimes).
#
# Same commit-to-gha-data idiom as collect.yml (worktree, shallow fetch, date-partitioned) -- this
# file must live on the DEFAULT branch (main) for schedule/workflow_dispatch to fire; it checks out
# CODE from $BRANCH but commits DATA to the gha-data branch, same as every other collector here.
#
# CRON OFFSET: collect=9,29,49 / live=3,28,53 / health=14,44 / strategy-alert=17 / wallet-track=23.
# 6,36 is clear of all of them.
#
# Loop 2 (WS latency) needs the same two repo secrets as live.yml (KALSHI_API_KEY_ID,
# KALSHI_PRIVATE_KEY) -- Kalshi's WS requires a signed connection even for read-only market data.
# Loops 1 and 3 need no secrets. Missing/invalid Kalshi secrets only turn loop 2 off (logged notice);
# they never fail the job -- see sidecar_feeds.py's ws_latency_loop.
name: sidecar-feeds

on:
  schedule:
    - cron: '6,36 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sidecar-feeds
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: |
          for i in 1 2 3; do pip install --quiet requests websockets cryptography && break; sleep 10; done
      - name: collect ~42 min of composite spot + Kalshi WS latency + macro calendar (gzipped)
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          rm -rf gha_data && mkdir -p gha_data
          umask 077
          if [ -n "$KALSHI_PRIVATE_KEY" ]; then
            printf '%s\n' "$KALSHI_PRIVATE_KEY" > "$RUNNER_TEMP/k.pem"
            chmod 600 "$RUNNER_TEMP/k.pem"
            export KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/k.pem"
          fi
          timeout --signal=TERM --kill-after=30 2640 \
            python -u sidecar_feeds.py 2520 gha_data || true
      - name: commit data to the gha-data branch (worktree, shallow, date-partitioned)
        if: always()
        run: |
          git config user.name  "sidecar-bot"
          git config user.email "sidecar-bot@users.noreply.github.com"
          test -n "$(ls -A gha_data 2>/dev/null)" || { echo "no data"; exit 0; }
          day=$(date -u +%Y-%m-%d)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "/tmp/dw/gha_data/$day"
          cp -r "$GITHUB_WORKSPACE/gha_data/." "/tmp/dw/gha_data/$day/"
          cd /tmp/dw
          git add gha_data
          git commit -m "gha: sidecar-feeds r${{ github.run_id }} ($day $(date -u +%H:%MZ))" \
            || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:gha-data" && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
