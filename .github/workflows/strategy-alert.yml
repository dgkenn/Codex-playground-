# 2-SIGMA STRATEGY ALERT. Hourly, aggregates every trial strategy's forward A/B ledger from the
# gha-data branch and, when any candidate crosses the two-sigma bar (|paired t| > 2 over >= 100
# forward windows vs the live P0 baseline), pushes a Telegram alert + a GitHub warning so we are
# made aware and can take action. Read-only, no money. Trial strategies live in box_policy_ab.py's
# TRIALS registry; adding one there auto-enrolls it here.
name: strategy-alert

on:
  schedule:
    - cron: '17 * * * *'         # hourly, offset off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write          # append a per-cycle metrics snapshot to the gha-data branch

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet numpy scipy pandas requests scikit-learn && break; sleep 10; done
      - name: pull forward A/B ledger fragments from gha-data
        run: |
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git checkout origin/gha-data -- gha_data 2>/dev/null || mkdir -p gha_data
          else
            mkdir -p gha_data
          fi
      - name: score every trial strategy from raw forward data + 2-sigma alert (Telegram if set)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # self-contained: re-score every collected window from the raw book/trade/settlement
          # streams (recursive over the date-partitioned gha-data), then report + 2-sigma alert.
          # metrics now print BY DEFAULT (curated risk/perf block per trial); tee each asset's full
          # report so the next step can persist a durable snapshot to gha-data.
          for A in btc eth sol xrp; do
            python box_policy_ab.py --alert --asset "$A" --dir gha_data \
              --ledger "/tmp/led_${A}.jsonl" 2>&1 | tee "/tmp/report_${A}.txt" || true
          done
      - name: append metrics snapshot to gha-data (durable forward time-series)
        if: always()
        run: |
          git config user.name  "metrics-bot"
          git config user.email "metrics-bot@users.noreply.github.com"
          day=$(date -u +%Y-%m-%d); ts=$(date -u +%H%MZ)
          mkdir -p /tmp/snap
          for A in btc eth sol xrp; do [ -f "/tmp/report_${A}.txt" ] && cp "/tmp/report_${A}.txt" "/tmp/snap/${A}.txt"; done
          [ -n "$(ls -A /tmp/snap 2>/dev/null)" ] || { echo "no snapshots to commit"; exit 0; }
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/mw origin/gha-data; cd /tmp/mw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/mw HEAD; cd /tmp/mw && git checkout --orphan gha-data
            git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/mw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p "/tmp/mw/gha_data/metrics/$day"
          for A in btc eth sol xrp; do
            [ -f "/tmp/snap/${A}.txt" ] && cp "/tmp/snap/${A}.txt" "/tmp/mw/gha_data/metrics/$day/${A}_${ts}.txt"
          done
          cd /tmp/mw && git add gha_data/metrics
          git commit -q -m "metrics snapshot $day $ts (per-trial risk/perf, all assets)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:gha-data" && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "metrics snapshot push failed after retries" >&2; exit 1
