# THE DURABLE LIGHT SWITCH for the live money bot. Runs the fully-wired trader when LIVE_SWITCH=on,
# is completely inert when off. Self-chains for near-continuous coverage; a cron re-checks the
# switch every ~25 min so the chain restarts itself if a runner dies. This is what lets the bot run
# while you are away / out of usage limits, with NO Claude session needed.
#
#   ON/OFF: edit the LIVE_SWITCH file (one word: on|off) on the $BRANCH branch -- or run
#           ./live_switch.sh on|off. That is the entire control surface.
#
#   ONE-TIME ACTIVATION (you do this; it's a real-money + secrets step, so it's deliberate):
#     1. Add two repository secrets (Settings -> Secrets and variables -> Actions):
#          KALSHI_API_KEY_ID   = your Kalshi API key id
#          KALSHI_PRIVATE_KEY  = the full RSA PEM (multiline secrets are fine)
#     2. This file must live on the DEFAULT branch (main) for schedule/dispatch to fire. Merging it
#        there is INERT until both secrets exist AND LIVE_SWITCH=on -- it cannot trade before then.
#     3. Flip the switch on.
#
#   SAFE BY DEFAULT: missing secrets OR LIVE_SWITCH!=on => the job does nothing. Same caps as the
#     attended bot ($5 max notional, $6 sticky loss-limit, post-only, reconciliation, dead-man).
#   STICKY KILL: a loss-limit trip writes the kill sentinel; this workflow then flips LIVE_SWITCH
#     to off and stops the chain. You re-arm by running ./live_switch.sh on (clears the sentinel).
#   SECURITY: triggers are schedule + workflow_dispatch ONLY (never pull_request), so a fork PR can
#     never reach the secret. The PEM is written to a 0600 temp file and shredded after each run.
name: live-trade

on:
  schedule:
    - cron: '3,28,53 * * * *'   # re-check the switch / restart the chain; offsets dodge congestion
  workflow_dispatch: {}

permissions:
  contents: write              # persist telemetry + sticky-kill switch flip
  actions: write               # self-chain the successor run

concurrency:
  group: live-trade-singleton  # CRITICAL: never two live bots at once (would double real orders)
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5
  ASSET: btc

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 56
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - name: gate on the switch (fail-closed)
        id: gate
        run: |
          sw=$(tr -d '[:space:]' < LIVE_SWITCH 2>/dev/null || echo off)
          [ -f ".kalshi_killed_${ASSET}15m" ] && sw=off
          echo "switch=$sw" >> "$GITHUB_OUTPUT"
          echo "live switch = $sw"
      - name: gate on secrets present
        id: sec
        run: |
          if [ -n "${{ secrets.KALSHI_API_KEY_ID }}" ] && [ -n "${{ secrets.KALSHI_PRIVATE_KEY }}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"; echo "::notice::KALSHI secrets not set -> inert"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        with:
          python-version: '3.12'
      - name: install deps
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        run: for i in 1 2 3; do pip install --quiet numpy scipy requests cryptography websockets && break; sleep 10; done
      - name: preflight + live trade (~46 min, full caps + rails)
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          # BUGFIX: the trader's per-fill / settlement / kill alerts no-op without these -- they were
          # absent here, so live Telegram stayed silent even when the bot filled boxes.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          I_UNDERSTAND_REAL_MONEY: "yes"
        run: |
          umask 077
          printf '%s\n' "$KALSHI_PRIVATE_KEY" > "$RUNNER_TEMP/k.pem"
          chmod 600 "$RUNNER_TEMP/k.pem"
          export KALSHI_PRIVATE_KEY_PATH="$RUNNER_TEMP/k.pem"
          if python kalshi_preflight.py --asset "$ASSET" | tee /tmp/pf.txt && grep -q "VERDICT: GO" /tmp/pf.txt; then
            # startup ping: you get confirmation the session is live; fills/settlements alert after.
            python -c "import notify; notify.alert_sync('🟢 live session armed ($ASSET) — preflight GO, \$5 cap, posting both sides. Box/settlement alerts follow on fills.')" || true
            timeout --signal=TERM --kill-after=60 2820 \
              python -u kalshi_trader.py --asset "$ASSET" --live --size-mode flat \
                --post 1 --max-notional 5 --loss-limit 6 --max-rungs 1 --duration 2760 || true
          else
            python -c "import notify; notify.alert_sync('🟡 live cycle skipped ($ASSET) — preflight NO-GO (market/balance gate); retries next cycle.')" || true
            echo "preflight NO-GO -> not trading this cycle"
          fi
          shred -u "$RUNNER_TEMP/k.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/k.pem"
      - name: persist telemetry + sticky-kill
        if: always() && steps.gate.outputs.switch == 'on'
        run: |
          git config user.name  "live-bot"
          git config user.email "live-bot@users.noreply.github.com"
          # STICKY KILL: a loss-limit trip wrote the sentinel -> flip LIVE_SWITCH off on the branch
          if [ -f ".kalshi_killed_${ASSET}15m" ]; then
            echo off > LIVE_SWITCH
            for i in 1 2 3 4 5; do
              git add LIVE_SWITCH && git commit -q -m "auto: loss-limit -> live switch OFF (sticky)" || true
              git push origin "HEAD:${BRANCH}" && break
              git fetch -q origin "$BRANCH" && git rebase -q "origin/${BRANCH}" || true
              sleep $((RANDOM % 5 + 2))
            done
          fi
          # TELEMETRY -> live-state branch (never pollute the code branch)
          mkdir -p /tmp/ls
          cp -f "kalshi_fees_${ASSET}15m.jsonl" kalshi_markout.jsonl \
                "live_metrics_kalshi_${ASSET}15m.jsonl" /tmp/ls/ 2>/dev/null || true
          if [ -n "$(ls -A /tmp/ls 2>/dev/null)" ]; then
            day=$(date -u +%Y-%m-%d)
            if git fetch --depth=1 origin live-state 2>/dev/null; then
              git worktree add --detach /tmp/lw origin/live-state; cd /tmp/lw && git checkout -B live-state
            else
              git worktree add --detach /tmp/lw HEAD; cd /tmp/lw && git checkout --orphan live-state
              git rm -rf --cached . >/dev/null 2>&1 || true
              find /tmp/lw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            fi
            mkdir -p "/tmp/lw/live_state/$day"
            cp /tmp/ls/* "/tmp/lw/live_state/$day/" 2>/dev/null || true
            cd /tmp/lw && git add live_state
            git commit -q -m "live telemetry r${{ github.run_id }} ($day $(date -u +%H:%MZ))" || true
            for i in 1 2 3 4 5; do
              git push origin HEAD:live-state && break
              git fetch --depth=1 origin live-state && git rebase origin/live-state || true
              sleep $((RANDOM % 5 + 2))
            done
          fi
      - name: self-chain (only while switch on, no kill)
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sw=$(tr -d '[:space:]' < LIVE_SWITCH 2>/dev/null || echo off)
          [ -f ".kalshi_killed_${ASSET}15m" ] && sw=off
          if [ "$sw" = "on" ]; then
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
                -d '{"ref":"main"}')
              [ "$code" = "204" ] && { echo "chained successor"; break; }
              echo "dispatch -> HTTP $code"; sleep $((2 ** i))
            done
          else
            echo "switch off / killed -> chain stops (cron re-checks every ~25 min)"
          fi
