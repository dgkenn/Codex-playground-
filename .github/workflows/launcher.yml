# GUARANTEED live-chain launcher. GitHub's cron scheduler is best-effort (observed stalled for
# hours on 2026-07-12); push events are webhook-delivered and always fire. Touching the LAUNCH
# file (any content change) on main dispatches live.yml@main -- the one-command manual start:
#   date -u > LAUNCH && git add LAUNCH && git commit -m launch && git push
# Also dispatchable from the Actions tab. Safe: live.yml itself is fail-closed (switch+secrets),
# and its singleton concurrency group means a duplicate dispatch just queues, never double-trades.
name: launcher
on:
  push:
    branches: [main]
    paths: [LAUNCH]
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: dispatch live.yml@main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/d.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && { echo "live.yml dispatched (204)"; exit 0; }
            echo "attempt $i -> HTTP $code"; cat /tmp/d.out || true; sleep $((2**i))
          done
          echo "::error::all dispatch attempts failed"; exit 1
