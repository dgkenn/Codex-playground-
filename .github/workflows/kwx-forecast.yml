# kwx-forecast -- daily PAPER snapshots for the forecast-edge sleeve (2nd-edge validation, no orders).
# Runs wx_forecast_forward.py settle+snapshot a few times in the US-morning UTC window (so each city is
# captured BEFORE its afternoon high, per the harness's validity guard), scores finished days from IEM ASOS
# truth, and commits the accumulating jsonl logs so the forward record survives ephemeral runners. Paper-only:
# no Kalshi credentials, no live-trading code -- it just measures whether forecast_prob beats the market price.
name: kwx-forecast

on:
  # DISABLED 2026-09-30. GitHub honors `schedule:` ONLY from the default branch, so an earlier
  # attempt to disable this on the code branch (2026-08-10) had no effect and the sleeve accrued
  # 1,914 further rows. This is the copy that actually governs the cron.
  #
  # The forecast sleeve is closed on its own merits: corrected EV about -0.04/contract at
  # day-clustered t approx -4.9 scored on Kalshi's OFFICIAL settlement at executable prices; the
  # corrected bracket_prob was forward-tested (rows from 2026-08-07) and the sign did not move; and
  # post-fix model Brier is WORSE than a constant base-rate predictor while the market's is far
  # better. See venue_expansion/FORWARD_DATA_2026-08-16.md on the research branch.
  #
  # workflow_dispatch retained so it can still be run by hand if the sleeve is ever re-registered.
  # schedule:
  #   - cron: '3 13,15,17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kwx-forecast
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip -q install numpy scipy && break; sleep 8; done
      - name: settle + snapshot (paper) + commit logs
        run: |
          set -e
          git config user.name  "kwx-forecast-bot"
          git config user.email "kwx-forecast-bot@users.noreply.github.com"
          python -u wx_forecast_forward.py settle   || true
          python -u wx_forecast_forward.py snapshot || true
          python -u wx_forecast_forward.py report   || true
          # add per-file: a batched `git add a b c` aborts ENTIRELY if any pathspec matches nothing,
          # and the paper/settled jsonls don't exist until the first snapshot/settle writes them.
          for f in wx_forecast_paper.jsonl wx_forecast_settled.jsonl; do
            if [ -e "$f" ]; then git add -f -- "$f"; fi
          done
          git commit -q -m "forecast paper $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git fetch -q origin "$BRANCH" && git rebase -q "origin/${BRANCH}" || true
            sleep $((RANDOM % 5 + 2))
          done
