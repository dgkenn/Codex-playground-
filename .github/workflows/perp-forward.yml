# perp-forward -- FORWARD-VALIDATION runner for the PERP<->15m-BINARY BASIS (edge (a)).
#
# perp_forward.py is a READ-ONLY replay harness (stdlib only, no keys, no orders, no live config) that
# rebuilds aligned Kalshi perp + co-collected 15m-binary (`binmid`) windows from origin/gha-data,
# derives the binary-implied spot via the FAVLONG fair-value inversion, applies the FROZEN
# perp_forward_config.json thresholds (entry=15bps, hold-to-binary-settle, delta-neutral), books
# realized post-cost P&L per (asset,day), and prints the pooled + per-asset day-clustered gate.
# It ALSO computes FAVLONG's per-day realized P&L on the same days and reports the day-level
# correlation (the orthogonality verdict: is edge (a) a diversifier or a hedged FAVLONG?).
# Params are FROZEN before forward day 1 (perp_strategy_design.md sec Gate); forward days apply the
# config UNCHANGED (no refit). Only COMPLETE days (strictly before today UTC) are scored, so logged
# rows never change. Idempotent -- keyed on (edge, asset, day).
#
# EDGE (b) funding-carry is a STUB only: Kalshi funding_rate is currently 0.0 -> nothing to harvest,
# NO carry trade; the harness logs the funding series so a sign flip is caught.
#
# Like favlong-forward.yml, the OUTPUT (perp_forward_log.jsonl) is a CODE-branch artifact that lives
# beside perp_forward.py, so we commit it back to $BRANCH, not to gha-data. Pure stdlib -- no numpy.
#
# Pull results: git show ${BRANCH}:perp_forward_log.jsonl   (or run `python perp_forward.py --report`)
#
# CRON OFFSET: favlong-forward=:33 6h / box-shadow=:47 every 3h / collect=:9,29,49 / live=:3,28,53 /
# health=:14,44 / strategy-alert=:17 / wallet-track=:23. This one is DAILY at 07:41 UTC -- distinct
# minute+hour, and late enough that the prior UTC day's perp+binmid ticks are fully committed to gha-data.
name: perp-forward

on:
  schedule:
    - cron: '41 7 * * *'   # daily 07:41 UTC (distinct from favlong-forward :33 6 and all minute-crons)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: perp-forward
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  perp-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: score new forward days + commit the log to the code branch
        if: always()
        run: |
          set -e
          git config user.name  "perp-forward-bot"
          git config user.email "perp-forward-bot@users.noreply.github.com"
          # perp_forward.py fetches origin gha-data itself (retry/backoff) and reads ticks via git-show;
          # it appends only NEW complete forward (edge,asset,day) rows and prints the pooled gate +
          # the FAVLONG orthogonality correlation.
          python -u perp_forward.py || true
          # commit only the forward log (nothing else changes)
          git add perp_forward_log.jsonl 2>/dev/null || true
          git commit -m "perp forward rows $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:${BRANCH} && exit 0
            git fetch origin ${BRANCH} && git rebase origin/${BRANCH} || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
