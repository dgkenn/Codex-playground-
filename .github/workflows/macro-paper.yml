# macro-paper -- forward OOS paper-track of the CPI/Fed-decision event-market sleeve
# (VENUE_SCAN.md: KXCPIYOY/KXCPICOREYOY/KXFEDDECISION have the widest spreads on Kalshi,
# ~47-53 ticks on thin rungs, low volume -- high edge-per-fill IF a fair-value anchor beats
# the market, monthly/8x-per-year cadence, capacity-capped by construction).
# Runs macro_paper.py daily: fetches the live CPI/Fed ladders, the Cleveland Fed inflation
# nowcast, and a ZQ-futures/NY-Fed-EFFR Fed-decision anchor (all public, read-only, no auth,
# no money), logs every rung scanned, SETTLES matured paper positions, and opens new ones
# where |edge| clears the spread-cost threshold. PAPER ONLY. State (macro_pending.json +
# macro_settled.jsonl + daily macro_paper_<date>.jsonl snapshots) persists on the gha-data
# branch. GitHub fires `schedule` only from the DEFAULT branch (main); this file lives on
# main, checks out CODE from $BRANCH, commits DATA to gha-data.
# Pull results:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
# Score anytime: python edge_verdicts.py score gha_data/macro_settled.jsonl --kind generic
#                (pre-registered bar is documented in macro_paper.py's module docstring:
#                 >=6 settled events AND aggregate t>=2, NOT the generic 14-day bar --
#                 CPI/FOMC events are monthly-cadence, so a day-count bar is meaningless here).
name: macro-paper

on:
  schedule:
    - cron: '52 15 * * *'      # 15:52 UTC daily -- clear of health(14,44)/alert(17)/live(3,28,53)/wallet-track(23 */6)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macro-paper
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  macro-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run macro CPI/Fed paper-track + commit to gha-data
        if: always()
        run: |
          set -e
          # pull existing state so the harness updates it in place
          git config user.name  "macro-paper-bot"
          git config user.email "macro-paper-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data
          cd "$GITHUB_WORKSPACE"
          python macro_paper.py /tmp/dw/gha_data || true
          cd /tmp/dw
          git add gha_data
          git commit -m "macro-paper CPI/Fed paper-track $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
