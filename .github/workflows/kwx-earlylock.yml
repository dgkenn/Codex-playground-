# kwx-earlylock -- READ-ONLY / PAPER forward price-logger for the "early-lock" refinement (no orders, no creds).
# The Phase-1 study (wx_earlylock_study.py) proved early-lock is PREDICTABLE (~96.88% win, ~60 min before the
# mechanical lock at thr-0.95). The open question is PRICE: does the live market actually offer those early rungs
# below the ~95.3c break-even, or has it already priced the same forecast to >=96c ("dead")? This workflow runs
# wx_earlylock_forward.py snapshot during BOTH signal windows the script itself covers (see its module
# docstring): the US afternoon rising-temp window (highs climbing) and the overnight/pre-dawn falling-temp
# window (lows cooling into their trough, 00:00->~sunrise LST -- wx_earlylock_study.py's own "Method" section),
# logging the real yes-ask at each signal. It settles finished days from IEM ASOS truth and commits the
# accumulating jsonl logs + climatology so the forward record survives ephemeral runners. PAPER-ONLY: no Kalshi
# secrets, no KWX_LIVE, never touches kwx-live.yml / KWX_SWITCH -- it only measures.
#
# FIX (batch/earlylock-fix-main): the original schedule only had the afternoon HIGH window -- the LOW mirror
# (kind='min', wx_earlylock_forward.py's "stations_low" map) had no cron slot of its own, so it was only ever
# snapshotted as an afternoon-leftover of the HIGH cron (by which point an overnight low has long since been
# reached and the running minimum is no longer "early") or once a day, mistimed, by the 07:20 UTC settle run
# (07:20 UTC is only ~3:20am Eastern / ~12:20am Pacific -- still hours before most stations' pre-dawn trough).
# Added a dedicated pre-dawn cron below so the LOW sleeve gets real sampling density instead of ~0.
name: kwx-earlylock

on:
  schedule:
    # US afternoon rising-temp window (highs climbing; early-lock can fire before the mechanical lock). Hourly
    # 18:00-23:00 UTC = ~10:00-18:00 across the eastern (UTC-5) to western (UTC-8) cities' local afternoons.
    - cron: '7 18,19,20,21,22,23 * * *'
    # overnight/pre-dawn falling-temp window (lows cooling toward their trough; early-lock can precede the
    # mechanical lock on the LOW mirror the same way). Hourly 08:00-13:00 UTC = ~04:00-06:00 Eastern through
    # ~01:00-06:00 Pacific/Phoenix local pre-dawn, i.e. the same LST hours wx_earlylock_study.py's LOW case
    # covers (00:00->~sunrise). Offset minute (10, not 7/20) so it never collides with the crons above/below.
    - cron: '10 8,9,10,11,12,13 * * *'
    # daily settle + report after all LST days are safely over (07:00 UTC ~= post-midnight even for UTC-8).
    - cron: '20 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kwx-earlylock
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  earlylock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip -q install numpy scipy && break; sleep 8; done
      - name: settle + snapshot (paper) + commit logs
        run: |
          set -e
          git config user.name  "kwx-earlylock-bot"
          git config user.email "kwx-earlylock-bot@users.noreply.github.com"
          # settle finished days, take a fresh live snapshot (skips cleanly if none qualify), then print the report.
          python -u wx_earlylock_forward.py settle   || true
          python -u wx_earlylock_forward.py snapshot || true
          python -u wx_earlylock_forward.py report   || true
          # force-add the paper logs (gitignored like the forecast sleeve) + the committed climatology json.
          # add per-file: a batched `git add a b c` aborts ENTIRELY if any pathspec matches nothing,
          # and the paper/settled jsonls don't exist until the first snapshot/settle writes them.
          for f in wx_earlylock_paper.jsonl wx_earlylock_settled.jsonl _earlylock_climatology.json; do
            if [ -e "$f" ]; then git add -f -- "$f"; fi
          done
          git commit -q -m "earlylock paper $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git fetch -q origin "$BRANCH" && git rebase -q "origin/${BRANCH}" || true
            sleep $((RANDOM % 5 + 2))
          done
