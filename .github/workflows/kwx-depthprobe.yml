# kwx-depthprobe -- structured order-book snapshots of near-lock Kalshi weather rungs during the US-afternoon
# fire window, to CALIBRATE DEPTH_CAP (the single lever that sets the monthly capacity ceiling). Runs
# `wx_capacity_probe.py --snapshot` every ~30 min through 18:00-01:00 UTC, appending full two-sided ladder
# levels (schema: wx_book_snapshot_schema.md) to wx_book_snapshots.jsonl, plus one daily `--report` printing
# the depth-distribution evidence after the window closes. Read-only public market data: no credentials, no
# orders. PROPOSE-ONLY, same pattern as kwx-earlylock's paper logs (gitignored jsonl, force-added by CI).
name: kwx-depthprobe

on:
  schedule:
    # snapshot sweep every ~30 min through the US-afternoon fire window, 18:00 UTC through 01:00 UTC next day
    - cron: '4,34 18-23 * * *'
    - cron: '4,34 0-1 * * *'
    # one daily aggregate report, after the window closes
    - cron: '40 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kwx-depthprobe
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: snapshot book depth (+ daily report) + commit
        run: |
          set -e
          git config user.name  "kwx-depthprobe-bot"
          git config user.email "kwx-depthprobe-bot@users.noreply.github.com"
          # structured sweep: append near-lock rung rows (full ladder levels) to wx_book_snapshots.jsonl
          python -u wx_capacity_probe.py --snapshot || true
          # once-daily aggregate report (identified by the specific cron entry, or on manual dispatch) --
          # prints to the run log only, no file output, so it doesn't affect what gets committed below.
          if [ "${{ github.event.schedule }}" = "40 1 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u wx_capacity_probe.py --report || true
          fi
          # force-add the single gitignored snapshot file, guarded -- never batch multiple files in one add.
          if [ -f wx_book_snapshots.jsonl ]; then
            git add -f wx_book_snapshots.jsonl || true
          fi
          git commit -q -m "depth snapshot $(date -u +%FT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git fetch -q origin "$BRANCH" && git rebase -q "origin/${BRANCH}" || true
            sleep $((RANDOM % 5 + 2))
          done
