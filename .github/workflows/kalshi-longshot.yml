# Kalshi LONGSHOT-MAKER paper-track -- forward OOS validation of the longshot-sell harvest
# (KALSHI_MAKER_VERDICT.md: sell overpriced longshots as a maker on soft zero-maker-fee cats,
# +0.97c/contract @17sigma net of adverse selection+fee, but capacity-capped ~$30-150/mo).
# Runs kalshi_longshot_paper.py daily: SETTLES matured paper positions (-> realized P&L) and
# SNAPSHOTS new open soft longshots (rest a maker YES-offer at the touch). READ-ONLY public
# Kalshi REST, no auth, NO money -- PAPER ONLY. State (pending.json + settled.csv) persists on
# the gha-data branch.  GitHub fires schedule only from the DEFAULT branch (main); this file
# lives on main, checks out CODE from $BRANCH (vw7ut5), commits DATA to gha-data.
# Pull results:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/longshot/
#
# To ACTIVATE: copy this file to .github/workflows/kalshi-longshot.yml on the main branch.
name: kalshi-longshot-paper

on:
  schedule:
    - cron: '30 17 * * *'      # 17:30 UTC daily -- one snapshot+settle pass per day is plenty
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kalshi-longshot
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  longshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run longshot paper-track + commit to gha-data
        if: always()
        run: |
          set -e
          # pull existing state so the harness updates it in place
          git config user.name  "longshot-bot"
          git config user.email "longshot-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data/longshot
          cd "$GITHUB_WORKSPACE"
          python kalshi_longshot_paper.py /tmp/dw/gha_data/longshot || true
          cd /tmp/dw
          git add gha_data/longshot
          git commit -m "kalshi-longshot paper-track $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
