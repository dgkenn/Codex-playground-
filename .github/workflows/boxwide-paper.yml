# Kalshi WIDE-BOX (W=15c, minute-2 anchor, 60s managed disposal) paper-track -- forward OOS
# validation of the 33-day path-simulation finding (scratchpad/boxwidth study: rest BOTH box
# legs W below their side of fair -- YES buy at mid-W, NO buy at (1-mid)-W -- entered at the
# minute-2 anchor; if exactly one leg fills and the other has not completed within 60s, dispose
# the strand via a taker cross at mid-/+1c, fee ceil(7*p*(1-p))c. Managed-strand EV rises
# monotonically in W across the simulated 1-10c grid, day-clustered t up to +48 vs W=1c, 33/33
# days pooled across btc/eth/sol/xrp; ride-to-settle is NEGATIVE at every W -- the 60s disposal
# IS the mechanism. W=15c extrapolates ~5c past the simulated grid edge; this paper-track is how
# that extrapolation gets checked instead of trusted). All 4 assets (KX{BTC,ETH,SOL,XRP}15M).
# Runs kalshi_boxwide_paper.py for a long-lived --duration poll loop each invocation (~1.5s
# polling cadence = the crossing detector): advances the armed/stranded/locked/disposed state
# machine on every open paper box and ARMS one new box per asset per window in the minute-2
# band. READ-ONLY public Kalshi REST, no auth, NO money -- PAPER ONLY (structurally incapable
# of placing orders; enforced by a source-scan test in kalshi_boxwide_paper_test.py). State
# (boxwide_pending.json + boxwide_settled.csv + daily jsonl) persists on the gha-data branch.
# GitHub fires schedule only from the DEFAULT branch (main); this file lives on main, checks
# out CODE from $BRANCH (vw7ut5), commits DATA to gha-data.
# Pull results:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/boxwide/
# Score anytime: python kalshi_boxwide_report.py gha_data/boxwide   (prints the PRE-REGISTERED
#                promotion bar every run: >=14 forward days, day-clustered t>=3 net of disposal
#                fees vs 0, >=80% days positive, per-asset sign consistent with the simulation
#                -- see kalshi_boxwide_paper.py's docstring; no live consideration before it
#                clears in full).
#
# CRON OFFSET: collect=9,29,49 / live=3,28,53 / health=14,44 / strategy-alert=17 / wallet-track=23
# (*/6) / sidecar-feeds=6,36 / tailbias-paper=11,41. 13,43 is clear of all of them.
name: boxwide-paper

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: boxwide-paper
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  boxwide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run boxwide paper-track (~42min poll loop) + commit to gha-data
        if: always()
        run: |
          set -e
          git config user.name  "boxwide-bot"
          git config user.email "boxwide-bot@users.noreply.github.com"
          # pull existing state so the harness updates it in place (same worktree idiom as
          # tailbias-paper.yml / kalshi-longshot.yml / sidecar-feeds.yml)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data/boxwide
          cd "$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=30 2640 \
            python -u kalshi_boxwide_paper.py /tmp/dw/gha_data/boxwide --duration 2520 || true
          cd /tmp/dw
          git add gha_data/boxwide
          git commit -m "boxwide-paper $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
