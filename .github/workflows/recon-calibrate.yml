# Weekly sim-to-real fill-model calibration report: joins the live trader's new telemetry
# (live_recon_<asset>15m_r*.jsonl per-window reconciliation + order_lifecycle_<asset>15m_r*.jsonl
# per-order events) against shadow_compare.py's paper A/B windows (shadow_windows_kalshi_<asset>15m_*.jsonl)
# to measure how far the paper queue model's fill/net predictions are from what live trading actually
# saw. recon_calibrate.py (READ-ONLY on shadow_compare.py) prints an ALERT-ONLY report -- it never
# edits shadow's constants; a constants change is an operator decision made by hand after reading the
# report. GitHub fires schedule only from the DEFAULT branch (main); this file lives on main, checks
# out CODE from $BRANCH (vw7ut5), reads + commits the DATA/report on gha-data.
# Pull results:  git fetch origin gha-data && git show origin/gha-data:gha_data/CALIBRATION.txt
#
# To ACTIVATE: copy this file to .github/workflows/recon-calibrate.yml on the main branch.
name: recon-calibrate

on:
  schedule:
    - cron: '26 8 * * 1'      # weekly, Monday 08:26 UTC -- clear of every other cron in this repo
                               # (collect 9,29,49 / health 14,44 / live 3,28,53 / sidecar 6,36 /
                               # strategy-alert 17 / kalshi-longshot 30 17 daily / etf-paper 30 14 Mon)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recon-calibrate
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run recon_calibrate.py against gha-data + commit the report
        if: always()
        run: |
          set -e
          git config user.name  "recon-calibrate-bot"
          git config user.email "recon-calibrate-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data
          cd "$GITHUB_WORKSPACE"
          python recon_calibrate.py --data-dir /tmp/dw/gha_data > /tmp/dw/gha_data/CALIBRATION.txt
          cd /tmp/dw
          git add gha_data/CALIBRATION.txt
          git commit -m "recon-calibrate report $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
