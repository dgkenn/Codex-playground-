# Overnight copy-validation: each hour, run one ~47-min copy_live cycle against the target wallet and
# commit the capture result to the gha-data branch. Across the night these accumulate into a stable
# capture-vs-depth curve (copy_agg.py). Read-only (CLOB /book + data-api /trades; places nothing).
# Durable where a local nohup is not (survives container recycling). See copy_live.py / COPY_PROTOCOL.md.
name: copy-validate

on:
  schedule:
    - cron: '17 * * * *'         # hourly (offset minute)
  workflow_dispatch:
    inputs:
      wallet:
        description: target wallet (default 0x20d2309cd9...)
        required: false

permissions:
  contents: write

concurrency:
  group: copy-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: run one copy_live cycle (~47 min)
        env:
          COPY_WALLET: ${{ github.event.inputs.wallet || '0x20d2309cd92b797ae7ca175ed828ed8a27fbe29d' }}
        run: timeout 2820 python copy_live.py 2760 || true
      - name: commit result to the gha-data DATA branch
        run: |
          test -f copy_result.json || { echo "no result (idle window)"; exit 0; }
          git config user.name  "paper-bot"; git config user.email "paper-bot@users.noreply.github.com"
          cp copy_result.json "/tmp/copy_result_${{ github.run_id }}.json"
          git fetch origin gha-data 2>/dev/null || true
          git worktree add -B gha-data /tmp/dw origin/gha-data 2>/dev/null || git worktree add --orphan -b gha-data /tmp/dw
          mkdir -p /tmp/dw/copy_results
          cp "/tmp/copy_result_${{ github.run_id }}.json" /tmp/dw/copy_results/
          cd /tmp/dw
          git add copy_results
          git commit -q -m "copy-validate ${{ github.run_id }} $(date -u +%H:%MZ)" || { echo nothing; exit 0; }
          for i in 1 2 3; do git pull --rebase --autostash -q origin gha-data 2>/dev/null || true; git push -q origin HEAD:gha-data && break; sleep 3; done
