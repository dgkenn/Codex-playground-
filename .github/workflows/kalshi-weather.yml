# Kalshi WEATHER vs NBM -- forward CLV / calibration DATA COLLECTION.
# Runs weather_clv_harness.py a few times daily and appends Kalshi book + NBM fair-value snapshot rows
# to the gha-data branch (gha_data/weather/weather_clv_log.csv). READ-ONLY public data (Kalshi public
# REST + NOAA/NWS NBM), no auth, no money. Purpose: KALSHI_WEATHER.md found a plausible recreational
# warm-tail mispricing but it is NOT snapshot-backtestable (when Kalshi disagrees with NBM we don't know
# who's right) -- this accumulates the >=30-45 days / >=6 cities of settled CLV needed to confirm whether
# NBM is calibrated and the deviation beats spread+fee, BEFORE risking any size.
#
# GitHub fires schedule only from the DEFAULT branch (main); this file lives on main, checks out CODE
# from $BRANCH (vw7ut5, where the weather scripts live), commits DATA to gha-data.
# Pull the log:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/weather/
name: kalshi-weather-clv

on:
  schedule:
    - cron: '15 16 * * *'      # 16:15 UTC -- midday, books active, NBM cycle fresh
    - cron: '15 22 * * *'      # 22:15 UTC -- late, captures intraday book evolution toward settle
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kalshi-weather
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet requests numpy pandas scipy && break; sleep 10; done
      - name: snapshot Kalshi weather + NBM, commit to gha-data
        if: always()
        env:
          CLV_LOG: ${{ github.workspace }}/out/weather_clv_log.csv
        run: |
          set -e
          mkdir -p out
          # pull the existing log so the harness APPENDS to it
          git fetch --depth=1 origin gha-data 2>/dev/null || true
          git show origin/gha-data:gha_data/weather/weather_clv_log.csv > out/weather_clv_log.csv 2>/dev/null || true
          python weather_clv_harness.py 1 || true       # days_ahead=1 (next-day high brackets)
          test -s out/weather_clv_log.csv || { echo "no weather rows logged (API/market gap)"; exit 0; }
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data/weather
          cp "$GITHUB_WORKSPACE/out/weather_clv_log.csv" /tmp/dw/gha_data/weather/
          cd /tmp/dw && git add gha_data/weather
          git commit -m "kalshi-weather clv $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
