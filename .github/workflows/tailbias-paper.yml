# Kalshi TAIL-BIAS (favorite-longshot bias) paper-track -- forward OOS validation of the
# tail-sell / favorite-buy harvest on KXBTC15M/KXETH15M/KXXRP15M (33-day calibration study,
# 11,219 settled windows: cheap 7-15c tail side settles in-the-money materially less often than
# implied at tau~9min; buying the favorite nets ~+1.2c/contract taker net of fees, ~+2.2c/contract
# hypothetical maker). SOL is excluded (flat-to-opposite sign in the calibration study).
# Runs kalshi_tailbias_paper.py for a long-lived --duration poll loop each invocation: SETTLES
# matured paper positions (-> realized P&L, both taker/maker variants) and DISCOVERS+ENTERS new
# tail-bias windows in the [8,10]min-to-close band. READ-ONLY public Kalshi REST, no auth, NO
# money -- PAPER ONLY. State (pending.json + settled.csv + daily jsonl) persists on the gha-data
# branch. GitHub fires schedule only from the DEFAULT branch (main); this file lives on main,
# checks out CODE from $BRANCH (vw7ut5), commits DATA to gha-data.
# Pull results:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/tailbias/
# Score anytime: python kalshi_tailbias_report.py gha_data/tailbias   (after checking out the
#                gha-data branch's gha_data/tailbias/ dir -- see kalshi_tailbias_paper.py docstring
#                for the pre-registered promotion bar this report scores against).
#
# CRON OFFSET: collect=9,29,49 / live=3,28,53 / health=14,44 / strategy-alert=17 / wallet-track=23
# (*/6) / sidecar-feeds=6,36. 11,41 is clear of all of them.
name: tailbias-paper

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tailbias-paper
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  tailbias:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run tailbias paper-track (~42min poll loop) + commit to gha-data
        if: always()
        run: |
          set -e
          git config user.name  "tailbias-bot"
          git config user.email "tailbias-bot@users.noreply.github.com"
          # pull existing state so the harness updates it in place (same worktree idiom as
          # kalshi-longshot.yml / sidecar-feeds.yml)
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data/tailbias
          cd "$GITHUB_WORKSPACE"
          timeout --signal=TERM --kill-after=30 2640 \
            python -u kalshi_tailbias_paper.py /tmp/dw/gha_data/tailbias --duration 2520 || true
          cd /tmp/dw
          git add gha_data/tailbias
          git commit -m "tailbias-paper $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
