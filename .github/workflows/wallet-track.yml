# Watch-list tracker: snapshot the winning makers every 6h to catch strategy DRIFT (value, activity
# mix, complete-set discount, clip/two-sidedness). Appends to wallet_track.jsonl on the gha-data DATA
# branch (never the code branch). Read-only (public data-api, no keys). See wallet_tracker.py / MAKERS.md.
name: wallet-track

on:
  schedule:
    - cron: '23 */6 * * *'        # every 6 hours (offset minute)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wallet-track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/polymarket-btc-backtest-XZkKI
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: snapshot watch-list (seed prior state from gha-data, then re-append)
        run: |
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          # seed the existing tracker file from gha-data so the diff vs previous works
          git fetch origin gha-data 2>/dev/null && git checkout origin/gha-data -- wallet_track.jsonl 2>/dev/null || true
          python wallet_tracker.py || true
          test -f wallet_track.jsonl || { echo "no snapshot"; exit 0; }
          cp wallet_track.jsonl /tmp/wt.jsonl
          git worktree add -B gha-data /tmp/dw origin/gha-data 2>/dev/null || git worktree add --orphan -b gha-data /tmp/dw
          cp /tmp/wt.jsonl /tmp/dw/wallet_track.jsonl
          cd /tmp/dw
          git add wallet_track.jsonl
          git commit -q -m "wallet-track snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo nothing; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin gha-data 2>/dev/null || true
            git push -q origin HEAD:gha-data && break
            sleep 3
          done
