# KXWTI (WTI crude oil daily strike ladder) maker paper-track -- forward OOS validation of the
# venue-scan niche #2 candidate (VENUE_SCAN.md: KXWTI, ~99 daily-settlement markets, 4-tick
# median spread, real depth -- the crypto box-harvester's fair-value architecture "ports as-is"
# to a WTI front-month futures feed instead of a crypto index). Runs kxwti_paper.py 2x/day:
# fetches the live KXWTI ladder + WTI front-month price, computes fair P(settle > strike) from
# a trailing-30d realized-vol normal approximation, logs would-be maker quotes at the touch, and
# settles previously-filled paper quotes against real Kalshi settlement results. READ-ONLY
# public APIs (Kalshi + Yahoo Finance), NO auth, NO money -- PAPER ONLY. State (kxwti_pending.
# json + kxwti_settled.csv + dated kxwti_paper_<date>.jsonl tape) persists on the gha-data
# branch. GitHub fires schedule only from the DEFAULT branch (main); this file lives on main,
# checks out CODE from $BRANCH (vw7ut5), commits DATA to gha-data.
# Pull results:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/
#
# PRE-REGISTERED BAR before any live consideration (see kxwti_paper.py docstring /
# edge_verdicts.py): >=14 forward days, day-clustered t>=3, positive on >=80% of days.
# Score with:  python edge_verdicts.py score gha_data/kxwti_settled.csv
#
# To ACTIVATE: copy this file to .github/workflows/kxwti-paper.yml on the main branch.

name: kxwti-paper

on:
  schedule:
    - cron: '41 13,21 * * *'   # 2x/day, offset clear of collect(9,29,49)/live(3,28,53)/
                                # health(14,44)/sidecar(6,36)/alert(17)/other daily crons
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kxwti-paper
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  kxwti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run KXWTI paper-track + commit to gha-data
        if: always()
        run: |
          set -e
          # pull existing state so the harness updates it in place
          git config user.name  "kxwti-bot"
          git config user.email "kxwti-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data
          cd "$GITHUB_WORKSPACE"
          python kxwti_paper.py /tmp/dw/gha_data || true
          cd /tmp/dw
          git add gha_data/kxwti_paper_*.jsonl gha_data/kxwti_pending.json gha_data/kxwti_settled.csv 2>/dev/null || true
          git add gha_data/
          git commit -m "kxwti-paper paper-track $(date -u +%FT%HZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
