# ETF momentum + trend (the locked two-sleeve book) -- FORWARD PAPER TRACK.
# Runs portfolio_live.py --paper-track weekly and appends the dated paper-equity + target row to the
# gha-data branch (gha_data/paper/portfolio_paper_track.jsonl). PAPER ONLY: computes the locked-config
# target + marks paper equity to market; NEVER places an order, no secrets, no brokerage API.
# Purpose: accumulate the real forward track to clear the go-live bar (rolling Sharpe >=0.7 over 3-6mo)
# BEFORE any real money. The active book is the candidate that NEEDS forward proof (the static
# Permanent-Portfolio alternative is trivially deployable and needs none).
#
# GitHub fires schedule only from the DEFAULT branch (main), so this file lives on main; it checks out
# CODE from $BRANCH (vw7ut5, where portfolio_live.py lives) and commits DATA to the gha-data branch.
# Pull the track:  git fetch origin gha-data && git checkout origin/gha-data -- gha_data/paper/
name: etf-paper-track

on:
  schedule:
    - cron: '30 14 * * 1'      # weekly, Monday 14:30 UTC (US ETFs have a fresh prior close)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: etf-paper
  cancel-in-progress: false

env:
  BRANCH: claude/polymarket-bot-live-ready-vw7ut5

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: for i in 1 2 3; do pip install --quiet yfinance numpy pandas scipy && break; sleep 10; done
      - name: paper-track + commit to gha-data
        if: always()
        run: |
          set -e
          mkdir -p out
          # pull the existing track so portfolio_live.py APPENDS to it (idempotent accumulation)
          git fetch --depth=1 origin gha-data 2>/dev/null || true
          git show origin/gha-data:gha_data/paper/portfolio_paper_track.jsonl > out/portfolio_paper_track.jsonl 2>/dev/null || true
          python portfolio_live.py --paper-track --capital 1000 --track-file out/portfolio_paper_track.jsonl || true
          test -s out/portfolio_paper_track.jsonl || { echo "no track row written (cache-only / fetch failed)"; exit 0; }
          git config user.name  "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if git fetch --depth=1 origin gha-data 2>/dev/null; then
            git worktree add --detach /tmp/dw origin/gha-data
            cd /tmp/dw && git checkout -B gha-data
          else
            git worktree add --detach /tmp/dw HEAD
            cd /tmp/dw && git checkout --orphan gha-data && git rm -rf --cached . >/dev/null 2>&1 || true
            find /tmp/dw -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/dw/gha_data/paper
          cp "$GITHUB_WORKSPACE/out/portfolio_paper_track.jsonl" /tmp/dw/gha_data/paper/
          cd /tmp/dw && git add gha_data/paper
          git commit -m "etf paper-track $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:gha-data && exit 0
            git fetch --depth=1 origin gha-data && git rebase origin/gha-data || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
