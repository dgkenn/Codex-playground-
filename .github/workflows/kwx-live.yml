# LIVE weather-nowcast bot ($10 canary) -- durable light switch + SELF-HEALING, modeled on the box's live.yml.
# Trades ONLY when KWX_SWITCH=on AND the Kalshi secrets exist; otherwise completely inert.
#
# SELF-HEALING (so a down bot recovers on its own):
#   - PRE-CHAIN: each run dispatches its successor at the START (parked pending in the singleton group) so the
#     next leg starts the instant this one ends EVEN IF this leg is cancelled/times out -- closes the 15-19 min
#     coverage gaps the diagnostic found (2026-07-19).
#   - SELF-CHAIN: each run also dispatches the NEXT run at the end (belt-and-suspenders).
#   - CRON BACKUP: every 20 min, restarts the chain if both dispatches were lost.
#   - HEARTBEAT: each run commits .kwx_heartbeat (UTC ts). The kwx-watchdog workflow alerts on Telegram +
#     re-dispatches if the heartbeat goes stale (both chain AND cron dead).
#   - singleton concurrency -> never two live bots at once.
#
#   ON/OFF: KWX_SWITCH file (on|off) -- ./kwx_switch.sh, or Telegram /on /off. ALERTS: FIRE/SETTLE/HALT to
#   Telegram if TELEGRAM_* secrets set. SAFE BY DEFAULT: missing Kalshi secrets OR switch!=on => nothing.
name: kwx-live

on:
  schedule:
    - cron: '*/20 * * * *'      # BACKUP restart (pre-chain + self-chain are primary continuity)
  workflow_dispatch: {}

permissions:
  contents: write               # persist logs + heartbeat
  actions: write                # pre-chain/self-chain: dispatch the next run

concurrency:
  group: kwx-live-singleton
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - name: gate on the switch (fail-closed)
        id: gate
        run: |
          sw=$(tr -d '[:space:]' < KWX_SWITCH 2>/dev/null || echo off)
          [ -f ".kwx_halt" ] && sw=off
          echo "switch=$sw" >> "$GITHUB_OUTPUT"; echo "KWX switch = $sw"
      - name: gate on secrets present
        id: sec
        run: |
          if [ -n "${{ secrets.KALSHI_API_KEY_ID }}" ] && [ -n "${{ secrets.KALSHI_PRIVATE_KEY }}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"; echo "::notice::KALSHI secrets not set -> inert"
          fi
      - name: pre-chain successor (parks in the concurrency queue -> starts the instant this leg ends)
        # Coverage fix (2026-07-19): the diagnostic saw 15-19 min uncovered gaps because the END-of-run
        # self-chain never fires when a leg is cancelled or times out -> nothing restarts until the ~20-min
        # cron. Dispatching the successor HERE parks it as PENDING in the kwx-live-singleton group
        # (cancel-in-progress:false serializes it), so it starts the moment this job ends EVEN IF this job dies
        # -- shrinking the inter-leg gap to setup time (~60-90s). The successor re-reads KWX_SWITCH + .kwx_halt
        # in its own gate, so OFF/halt during this leg still stops the chain. End-of-run self-chain kept too.
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kwx-live.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && { echo "successor parked in concurrency queue"; break; }
            echo "pre-dispatch -> HTTP $code"; sleep $((2 ** i))
          done
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        with:
          python-version: '3.12'
      - name: run live weather bot (~16 min), commit logs + heartbeat
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          KWX_LIVE: "1"
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}   # optional: arms Synoptic-primary feed (kwx_runner._synoptic_primary); absent = free-feed cascade, unchanged behavior
        run: |
          set -e
          pip -q install cryptography numpy scipy || true   # scipy/numpy: MADIS hfmetar netCDF parse (free 5-min feed)
          git config user.name  "kwx-live-bot"
          git config user.email "kwx-live-bot@users.noreply.github.com"
          # single ~16-min python leg (fits the 20-min job timeout with slack for pip + git push):
          # the runner computes an adaptive 5s/20s near-strike cadence every cycle, but the old bash
          # `--once; sleep 30` wrapper DISCARDED it (flat 30s + a full interpreter/import start per
          # poll -- exactly when strikes are in play we polled slowest). --max-seconds runs the real
          # adaptive loop and exits cleanly at the bound; the python loop now writes .kwx_heartbeat
          # itself once per poll cycle, so the watchdog goes stale exactly when polling stops
          # (the bash beat could keep "alive" ticking around a wedged runner).
          python kwx_secret_bootstrap.py || true   # RSA-OAEP secret delivery (no-op once SYNOPTIC_TOKEN secret exists)
          python -u kwx_paper_gate.py --max-seconds 960 || true
          # add per-file: a batched `git add a b c` aborts ENTIRELY (staging nothing) if any one
          # pathspec matches nothing, and several of these files don't exist until a fire/settle has
          # happened -- which silently dropped heartbeat + paper fires + cap state every leg.
          for f in kwx_runner_plan.jsonl kwx_forward_settled.jsonl kwx_exec_log.jsonl kwx_near_miss.jsonl kwx_gate_status.txt kwx_runner_state.json .kwx_heartbeat; do
            if [ -e "$f" ]; then git add -f -- "$f"; fi
          done
          git commit -m "kwx-live $(date -u +%FT%H%MZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push origin HEAD:${BRANCH} && break
            git fetch origin ${BRANCH} && git rebase origin/${BRANCH} || true
            sleep $((RANDOM % 6 + 2))
          done
      - name: self-chain (dispatch next run while switch on) -- self-healing continuity
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sw=$(tr -d '[:space:]' < KWX_SWITCH 2>/dev/null || echo off)
          [ -f ".kwx_halt" ] && sw=off
          if [ "$sw" = "on" ]; then
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kwx-live.yml/dispatches" \
                -d '{"ref":"main"}')
              echo "self-chain dispatch -> HTTP $code"
              [ "$code" = "204" ] && break
              sleep $((2 ** i))
            done
          else
            echo "switch off -> not chaining"
          fi
