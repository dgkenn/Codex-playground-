# LIVE weather-nowcast bot ($10 canary) -- durable light switch + SELF-HEALING, modeled on the box's live.yml.
# Trades ONLY when KWX_SWITCH=on AND the Kalshi secrets exist; otherwise completely inert.
#
# SELF-HEALING (so a down bot recovers on its own):
#   - SELF-CHAIN: each run dispatches the NEXT run at the end (github.token) -> near-continuous coverage that
#     does NOT depend on GitHub's flaky cron.
#   - CRON BACKUP: every 20 min, restarts the chain if a run died without chaining.
#   - HEARTBEAT: each run commits .kwx_heartbeat (UTC ts). The kwx-watchdog workflow alerts on Telegram +
#     re-dispatches if the heartbeat goes stale (both chain AND cron dead).
#   - singleton concurrency -> never two live bots at once.
#
#   ON/OFF: KWX_SWITCH file (on|off) -- ./kwx_switch.sh, or Telegram /on /off. ALERTS: FIRE/SETTLE/HALT to
#   Telegram if TELEGRAM_* secrets set. SAFE BY DEFAULT: missing Kalshi secrets OR switch!=on => nothing.
name: kwx-live

on:
  schedule:
    - cron: '*/20 * * * *'      # BACKUP restart (self-chain is primary continuity)
  workflow_dispatch: {}

permissions:
  contents: write               # persist logs + heartbeat
  actions: write                # self-chain: dispatch the next run

concurrency:
  group: kwx-live-singleton
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - name: gate on the switch (fail-closed)
        id: gate
        run: |
          sw=$(tr -d '[:space:]' < KWX_SWITCH 2>/dev/null || echo off)
          [ -f ".kwx_halt" ] && sw=off
          echo "switch=$sw" >> "$GITHUB_OUTPUT"; echo "KWX switch = $sw"
      - name: gate on secrets present
        id: sec
        run: |
          if [ -n "${{ secrets.KALSHI_API_KEY_ID }}" ] && [ -n "${{ secrets.KALSHI_PRIVATE_KEY }}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"; echo "::notice::KALSHI secrets not set -> inert"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        with:
          python-version: '3.12'
      - name: run live weather bot (~16 min), commit logs + heartbeat
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          KWX_LIVE: "1"
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          pip -q install cryptography || true
          git config user.name  "kwx-live-bot"
          git config user.email "kwx-live-bot@users.noreply.github.com"
          END=$(( $(date +%s) + 960 ))     # ~16 min live loop
          while [ "$(date +%s)" -lt "$END" ]; do
            python -u kwx_paper_gate.py --once || true
            date -u +%FT%TZ > .kwx_heartbeat   # liveness beat each cycle
            sleep 30
          done
          git add -f kwx_runner_plan.jsonl kwx_forward_settled.jsonl kwx_exec_log.jsonl kwx_gate_status.txt .kwx_heartbeat 2>/dev/null || true
          git commit -m "kwx-live $(date -u +%FT%H%MZ)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push origin HEAD:${BRANCH} && break
            git fetch origin ${BRANCH} && git rebase origin/${BRANCH} || true
            sleep $((RANDOM % 6 + 2))
          done
      - name: self-chain (dispatch next run while switch on) -- self-healing continuity
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sw=$(tr -d '[:space:]' < KWX_SWITCH 2>/dev/null || echo off)
          [ -f ".kwx_halt" ] && sw=off
          if [ "$sw" = "on" ]; then
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kwx-live.yml/dispatches" \
                -d '{"ref":"main"}')
              echo "self-chain dispatch -> HTTP $code"
              [ "$code" = "204" ] && break
              sleep $((2 ** i))
            done
          else
            echo "switch off -> not chaining"
          fi
