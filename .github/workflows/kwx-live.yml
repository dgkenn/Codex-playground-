# LIVE weather-nowcast bot ($10 canary) -- the durable light switch, modeled on the box's live.yml.
# Runs the real-money weather trader ONLY when KWX_SWITCH=on AND the Kalshi secrets exist; otherwise
# it is completely inert. No Claude session needed -- it runs on GitHub's schedule.
#
#   ON/OFF: edit the KWX_SWITCH file (one word: on|off) on $BRANCH -- or run ./kwx_switch.sh on|off,
#           or the Telegram bot's /kwxon /kwxoff (kwx_telegram.py). That is the entire control surface.
#
#   ONE-TIME ACTIVATION (deliberate; real money + secrets):
#     1. Repo secrets (reuse the box's -- already set if the box ran live):
#          KALSHI_API_KEY_ID  = your Kalshi API key id
#          KALSHI_PRIVATE_KEY = the full RSA PEM (multiline ok)
#     2. This file must be on the DEFAULT branch (main) for `schedule` to fire (merge the PR).
#     3. Flip KWX_SWITCH on.
#
#   SAFE BY DEFAULT: missing secrets OR KWX_SWITCH!=on => the job does NOTHING. Bot-side guards stay on
#     (BANKROLL=$10, 5% per-fire cap, 60%/day deploy cap, circuit breaker, fat-finger ceilings, kill switch).
#   SECURITY: schedule + workflow_dispatch ONLY (never pull_request), so a fork PR can't reach the secret.
#     The PEM is written to a 0600 temp file and shredded after the run.
name: kwx-live

on:
  schedule:
    - cron: '*/20 * * * *'      # every 20 min; each run time-boxes an ~18-min live poll loop
  workflow_dispatch: {}

permissions:
  contents: write               # persist exec/plan/settled logs back to the branch (for monitoring)

concurrency:
  group: kwx-live-singleton     # never two live weather bots at once (would double real orders)
  cancel-in-progress: false

env:
  BRANCH: claude/coding-bot-ab-test-results-ffmhxw

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
      - name: gate on the switch (fail-closed)
        id: gate
        run: |
          sw=$(tr -d '[:space:]' < KWX_SWITCH 2>/dev/null || echo off)
          [ -f ".kwx_halt" ] && sw=off
          echo "switch=$sw" >> "$GITHUB_OUTPUT"; echo "KWX switch = $sw"
      - name: gate on secrets present
        id: sec
        run: |
          if [ -n "${{ secrets.KALSHI_API_KEY_ID }}" ] && [ -n "${{ secrets.KALSHI_PRIVATE_KEY }}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"; echo "::notice::KALSHI secrets not set -> inert"
          fi
      - name: pre-chain successor (parks in the concurrency queue -> starts the instant this leg ends)
        # Coverage fix (2026-07-19): the diagnostic saw 15-19 min uncovered gaps because the END-of-run
        # self-chain never fires when a leg is cancelled or times out -> nothing restarts until the ~20-min
        # cron. Dispatching the successor HERE parks it as PENDING in the kwx-live-singleton group
        # (cancel-in-progress:false serializes the group), so it starts the moment this job ends EVEN IF this
        # job dies -- shrinking the inter-leg gap to setup time (~60-90s). The successor re-reads KWX_SWITCH +
        # .kwx_halt in its own gate, so an OFF/halt during this leg still stops the chain. The end-of-run
        # self-chain stays as belt-and-suspenders; GitHub keeps only the newest pending run in the group.
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kwx-live.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && { echo "successor parked in concurrency queue"; break; }
            echo "pre-dispatch -> HTTP $code"; sleep $((2 ** i))
          done
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        with:
          python-version: '3.12'
      - name: run live weather bot (~18 min), commit logs
        if: steps.gate.outputs.switch == 'on' && steps.sec.outputs.have == 'yes'
        env:
          KWX_LIVE: "1"
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          set -e
          pip -q install cryptography numpy scipy || true   # scipy/numpy: MADIS hfmetar netCDF parse (free 5-min feed)
          git config user.name  "kwx-live-bot"
          git config user.email "kwx-live-bot@users.noreply.github.com"
          # time-boxed live loop: poll + settle for ~18 min, then exit (cron restarts the next one)
          END=$(( $(date +%s) + 1080 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            python -u kwx_paper_gate.py --once || true    # --once does one poll+settle+report cycle
            sleep 30
          done
          git add kwx_runner_plan.jsonl kwx_forward_settled.jsonl kwx_exec_log.jsonl kwx_gate_status.txt 2>/dev/null || true
          git commit -m "kwx-live $(date -u +%FT%H%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git push origin HEAD:${BRANCH} && exit 0
            git fetch origin ${BRANCH} && git rebase origin/${BRANCH} || true
            sleep $((RANDOM % 6 + 2))
          done
          echo "push failed after retries" >&2; exit 1
