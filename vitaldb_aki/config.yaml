# config.yaml -- single source of truth for the VitalDB postoperative-AKI study.
# Protocol: VitalDB_AKI_PK_incremental_prediction_protocol.md (v1.0).
# Everything that can change a result lives here, not in code. Pre-register before
# any outcome-coupled modeling (Sec 14).

study: "vitaldb_aki_pk_incremental"
seed: 20260626

# ---- data source (Sec 4): VitalDB open API, no credentials -----------------
data:
  source: "VITALDB_OPEN"
  api_base: "https://api.vitaldb.net"
  cache_dir: "vitaldb_aki/cache"      # local parquet/csv cache (git-ignored)
  # endpoints
  cases_url: "https://api.vitaldb.net/cases"
  labs_url: "https://api.vitaldb.net/labs"
  trks_url: "https://api.vitaldb.net/trks"
  time_unit: "seconds_from_casestart"  # casestart == 0 for every case

# ---- cohort & eligibility (Sec 5) ------------------------------------------
cohort:
  min_age_years: 18
  exclude_cardiac: true               # non-cardiac only (Sec 4/5)
  # ESRD / chronic dialysis / transplant / obstetric / AV-fistula exclusions (Sec 5).
  # VitalDB has no diagnosis codes for several of these; rules are best-effort and
  # documented per-flag in cohort/eligibility.py.
  exclude_preexisting_esrd: true
  esrd_baseline_cr_mgdl: 4.0          # baseline cr >= this -> treat as advanced CKD/ESRD flag
  exclude_obstetric: true
  exclude_transplant: true
  exclude_av_fistula: true
  # labelable subset requires a baseline AND >=1 qualifying postop creatinine.
  require_postop_creatinine: true

# ---- outcome: KDIGO creatinine criteria (Sec 6) ----------------------------
kdigo:
  # absolute rise >= abs_rise_mgdl within abs_window_h hours
  abs_rise_mgdl: 0.3
  abs_window_h: 48
  # OR relative >= rel_ratio x baseline within rel_window_h hours
  rel_ratio: 1.5
  rel_window_h: 168                   # 7 days
  # window reference point: end of surgery (opend). Postop creatinine = dt > ref.
  window_anchor: "opend"
  baseline: "preop_cr"                # most recent preop creatinine (Sec 6)
  # if preop_cr missing, optionally fall back to most-recent preop lab cr (dt<anchor)
  baseline_fallback_to_labs: true
  baseline_preop_window_h: 720        # accept preop lab cr within 30 d before anchor

# ---- composite end-organ-damage outcome (PRIMARY) --------------------------
# Per protocol amendment: the PRIMARY outcome is a composite of objectively-
# labelable postoperative end-organ injury; the individual organ components are
# pre-specified SECONDARY outcomes. Each component is defined by an objective
# postoperative lab/outcome threshold relative to a preoperative baseline, in the
# same spirit as KDIGO (clean, adjudication-free). Myocardial injury is NOT
# included: VitalDB's open lab set has no troponin/CK (documented limitation).
# Every component label may use postoperative data BY DEFINITION; no postoperative
# value may ever become a FEATURE (Sec 11 firewall, enforced separately).
organ_outcomes:
  postop_window_h: 168                  # 7 days, shared default
  ULN:                                  # upper limits of normal (SNUH lab refs)
    ast: 40.0
    alt: 40.0
    tbil: 1.2
  components:
    renal:                              # KDIGO creatinine (see kdigo block)
      enabled: true
      source: "kdigo"
    hepatocellular:                     # DILI-style transaminitis
      enabled: true
      analytes: ["ast", "alt"]
      rule: "peak_ge_mult_uln"
      mult_uln: 3.0                     # AST or ALT >= 3x ULN
      exclude_optypes: ["Hepatic", "Biliary/Pancreas", "Transplantation"]  # injury is the surgical target
    cholestatic:
      enabled: true
      analytes: ["tbil"]
      rule: "peak_ge_mult_uln"
      mult_uln: 2.0                     # bilirubin >= 2x ULN
      exclude_optypes: ["Hepatic", "Biliary/Pancreas", "Transplantation"]
    coagulation_plt:                    # thrombocytopenia (consumptive, not dilutional)
      enabled: true
      analytes: ["plt"]
      rule: "nadir_below_or_drop"
      nadir_below: 100.0                # postop nadir < 100 (x10^3/uL)
      drop_frac_from_baseline: 0.5      # OR >=50% fall from preop
      # confound control: a platelet fall under massive hemorrhage/transfusion is
      # plausibly DILUTIONAL, not organ injury -> not labelable when present.
      exclude_if_massive_transfusion: true
      massive_ebl_ml: 2000.0            # intraop estimated blood loss >= 2 L, or
      massive_rbc_ml: 1000.0            # intraop RBC transfused >= ~1 L (~3-4 units)
    coagulation_inr:                    # hepatic/synthetic coagulopathy (de-confounded)
      enabled: true
      analytes: ["ptinr"]
      # was peak_ge (absolute postop INR>=1.5) -- confounded by preop warfarin/DOAC.
      # Now require a postop rise from a documented NORMAL preop INR; anticoagulated
      # or undocumented-baseline cases are not labelable for this component.
      rule: "rise_from_normal_baseline"
      threshold: 1.5                    # postop INR >= 1.5 ...
      baseline_normal_max: 1.3          # ... AND documented preop INR < 1.3
    hypoperfusion:                      # global ischemia (confounded: sicker cases get postop lactate)
      enabled: true
      analytes: ["lac"]
      rule: "peak_ge"
      threshold: 4.0
    mortality:
      enabled: true
      source: "death_inhosp"
  primary: "composite_any"             # primary label = any enabled component positive

# ---- feature sets (Sec 9: three nested sets) -------------------------------
feature_sets:
  standard: "clinical + basic intraop hemodynamics (prior-work baseline)"
  comprehensive: "full Sec 7 taxonomy"
  pk: "Sec 8 pharmacokinetic / drug-exposure features"

# ---- modeling & evaluation (Sec 9-12) --------------------------------------
evaluation:
  target: "composite"                 # primary outcome; secondaries: organ_renal, organ_*
  split_unit: "subjectid"             # patient-level splits (Sec 11.6)
  outer_folds: 5
  inner_folds: 5
  primary_incremental_contrast: "pk_vs_comprehensive"   # H2 primary (Sec 9/12)
  bootstrap_iters: 800
  metrics: ["auroc", "auprc", "calibration", "decision_curve"]
  class_imbalance: "class_weight"     # + report AUPRC (Sec 10)

# ---- leakage battery (Sec 11) ----------------------------------------------
leakage:
  prediction_cutoff: "opend"          # end of surgery; no later data as features
  forbid_postop_features: true
  negative_controls: ["shuffled_labels", "phase_randomized_signals"]

audit:
  # any feature whose source timestamp is after prediction_cutoff is a hard error.
  enforce_no_postop_features: true
